name: Greyhound strategies on the live books (read-only)

# Every strategy of the limit-order study scored on the live-key books (research/greyhound/live_eval.py; the owner,
# 3 Nov 2026: "now we have live data. We evaluate all of our possible strategies, on how they would have done on live
# books"). Read-only: S3 in, the report as the run's summary and artifact out; nothing is written to the store and
# nothing can place an order. Nightly after the last race, and on demand.

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'first live-key day, YYYY-MM-DD (default 2026-11-03)'
        required: false
        type: string
      date_to:
        description: 'last day, YYYY-MM-DD (default today UK: its settled races)'
        required: false
        type: string
  push:
    branches: ['claude/determined-fermi-*']
    paths:
      - 'research/greyhound/live_eval.py'
      - '.github/workflows/greyhound-live-eval.yml'

permissions:
  contents: read

concurrency:
  group: greyhound-live-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Free disk space
        # GitHub's ubuntu-26.04 runners keep /mnt on the root disk: the swap file left no room and the job died
        # with "No space left on device" (greyhound-live.yml run 43386968806, 13 Nov 2026). Unused tool caches go first.
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1; free -g | sed -n 2,3p
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: Every strategy on the live books
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          FROM: ${{ inputs.date_from }}
          TO: ${{ inputs.date_to }}
        run: |
          mkdir -p out
          ARGS=(--out out/greyhound_live_eval)
          for v in "$FROM" "$TO"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "dates must be YYYY-MM-DD"; exit 1; fi
          done
          if [ -n "$FROM" ]; then ARGS+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then ARGS+=(--to "$TO"); fi
          python -m research.greyhound.live_eval "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/greyhound_live_eval.md ] && head -c 60000 out/greyhound_live_eval.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-live-eval-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
