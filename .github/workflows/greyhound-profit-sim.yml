name: Greyhound profit simulator on the live books (read-only)

# The profit simulator (research/greyhound/profit_sim.py; the owner, 3 Nov 2026: optimise the profit of each race).
# Queue-aware fills on the live-key books, the green-up 5 s before the off, 2% commission; calibrated first on the live
# trader's own orders. Read-only: S3 in, the report as the run's summary and artifact out; nothing is written to the
# store and nothing can place an order. Nightly after the last race, and on demand.

on:
  schedule:
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UK racing day, YYYY-MM-DD (default today)'
        required: false
        type: string
  push:
    branches: ['claude/determined-fermi-*']
    paths:
      - 'research/greyhound/profit_sim.py'
      - '.github/workflows/greyhound-profit-sim.yml'

permissions:
  contents: read

concurrency:
  group: greyhound-profit-sim
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: The profit simulator
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DAY: ${{ inputs.date }}
        run: |
          mkdir -p out
          ARGS=(--out out/greyhound_profit_sim)
          if [ -n "$DAY" ]; then
            if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date must be YYYY-MM-DD"; exit 1; fi
            ARGS+=(--date "$DAY")
          fi
          python -m research.greyhound.profit_sim "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/greyhound_profit_sim.md ] && head -c 60000 out/greyhound_profit_sim.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-profit-sim-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
