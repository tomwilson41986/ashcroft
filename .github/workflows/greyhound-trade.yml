name: Greyhound trading (the owner's book, on its own)

# The greyhound model's trader on its own, for a day the horse trader is not running (the owner's ask of 6 Oct 2026:
# "go live today, place bets and trades today"; greyhound/live.py, greyhound/live_config.json). On a horse-trading day
# the greyhound trader runs inside live-trade.yml instead; this job is run by hand. One runner serves the trading and
# the market record, so this job also keeps the day's record (betfair_recorder.py, read-only) going beside the trader:
# start it after cancelling the day's recorder run (live-record.yml), and the record carries on in the same day files.
#
# The rule: each GB greyhound runner backed once, at its first real price (back and lay within 25%) after the
# morning's prices are in (greyhound-live.yml), where the edge clears 0.2; GBP5 level, held, no price over 20, GBP10 a
# race, no daily cap (from 7 Oct), fill-or-kill. Real orders only with the repository variable GREYHOUND_LIVE=yes;
# the S3 object greyhound/STOP or trading/STOP stops new bets within a minute; cancelling this run stops everything
# (a matched back stays matched).

on:
  workflow_dispatch:
    inputs:
      until:
        description: 'last UK time to trade and record, HH:MM'
        required: false
        type: string
        default: '21:30'

permissions:
  contents: read

concurrency:
  group: greyhound-trade
  cancel-in-progress: false

jobs:
  trade:
    if: vars.BETFAIR_RUNNER != ''
    runs-on: ${{ vars.BETFAIR_RUNNER }}
    timeout-minutes: 900
    steps:
      - name: Choose the session
        id: run
        env:
          UNTIL: ${{ inputs.until }}
        run: |
          UNTIL="${UNTIL:-21:30}"
          if ! [[ "$UNTIL" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then echo "until must be HH:MM"; exit 1; fi
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Python on the UK server
        # the same Python 3.12 environment the trader uses (live-trade.yml)
        run: |
          VENV="$HOME/.venvs/ashcroft"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt

      - name: Write the Betfair certificate
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            mkdir -p "$HOME/.betfair/certs"
            printf '%s\n' "$BETFAIR_CERT" > "$HOME/.betfair/certs/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$HOME/.betfair/certs/betfair.key"
            chmod 600 "$HOME/.betfair/certs/betfair.key"
            echo "BETFAIR_CERT_FILE=$HOME/.betfair/certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$HOME/.betfair/certs/betfair.key" >> "$GITHUB_ENV"
          fi

      - name: Trade the greyhounds, record the markets
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
          GREYHOUND_LIVE: ${{ vars.GREYHOUND_LIVE }}
          UNTIL: ${{ steps.run.outputs.until }}
        run: |
          # the day's market record (read-only), as live-record.yml keeps it: one runner serves both
          python betfair_recorder.py --record --final --until "$UNTIL" > "$RUNNER_TEMP/recorder.log" 2>&1 &
          REC=$!
          python betfair_recorder.py --record --final --until "$UNTIL" --market-types OTHER_PLACE,EACH_WAY \
            --tag other_place > "$RUNNER_TEMP/other_place.log" 2>&1 &
          OTHER=$!
          python betfair_recorder.py --record --final --until "$UNTIL" --event-type 4339 --tag greyhound \
            --market-types WIN,PLACE > "$RUNNER_TEMP/greyhound.log" 2>&1 &
          DOGS=$!
          GHLIVE=()
          if [ "$GREYHOUND_LIVE" = yes ]; then GHLIVE=(--live); else echo "GREYHOUND_LIVE is not 'yes': paper"; fi
          set +e
          # the trader alone reads the live key's feed when there is one; the records keep the delayed key
          BETFAIR_APP_KEY="${BETFAIR_LIVE_APP_KEY:-$BETFAIR_APP_KEY}" python -m greyhound.live --trade "${GHLIVE[@]}" \
            --until "$UNTIL"
          CODE=$?
          wait "$REC"; echo "recorder exited $?"
          wait "$OTHER"; echo "other place record exited $?"
          wait "$DOGS"; echo "greyhound record exited $?"
          tail -n 5 "$RUNNER_TEMP/recorder.log" "$RUNNER_TEMP/greyhound.log"
          exit $CODE

      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greyhound-trade-${{ github.run_id }}
          path: ~/.ashcroft/greyhound/
          if-no-files-found: ignore
          retention-days: 90
