name: Research query

# Read-only diagnostics against horse_racing.db for the research loop: every
# script in research/queries/ runs and its output is uploaded. Push-triggered on
# the research branch (a workflow only on a branch cannot be dispatched).

on:
  workflow_dispatch:
  push:
    branches: ['claude/happy-ritchie-*']
    paths:
      - 'research/queries/**'
      - '.github/workflows/research-query.yml'
      - '.github/workflows/research-query.yml'

permissions:
  contents: read
  actions: read   # a query may read a train run's model artifact (matrix_live_parity.py)

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add swap
        # a query may build the live path's features on the whole history (matrix_live_parity.py)
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h
      - name: Download historic database from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: python scripts/fetch_data.py --db-only --s3-bucket horseracingresults --s3-key horse_racing.db
      - name: Feature cache key
        id: fkey
        run: echo "key=$(python -c "import model.feature_cache as f; print(f.cache_key('horse_racing.db', '2021-01-01'))")" >> "$GITHUB_OUTPUT"
      - name: Restore the feature matrix (if one is cached for this code and data)
        # Best effort: a query that wants the matrix loads it from .feature_cache
        # and skips its part when the restore missed.
        uses: actions/cache/restore@v4
        with:
          path: .feature_cache
          key: features-${{ steps.fkey.outputs.key }}
      - name: Run the queries
        env:
          # read-only S3 for queries that need files beside the database (the 06:00 record)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRED_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PRED_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # no pending query (all moved to done/) must run nothing, not a file named '*'
          shopt -s nullglob
          mkdir -p out
          for q in research/queries/*.py; do
            name=$(basename "$q" .py)
            echo "::group::$name"
            python "$q" 2>&1 | tee "out/$name.txt" || true
            echo "::endgroup::"
          done
          for f in out/*.txt; do { echo "## $(basename "$f")"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-query-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          # snapshots kept long enough for the forward revision test
          retention-days: 90
