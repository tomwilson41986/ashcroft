name: Greyhound early lay, a day replayed on the recorded books (read-only)

# The owner, 15 Nov 2026: "How would the early lays have performed today?", then "Yes do this"
# (research/greyhound/day_replay.py): the forward test's lays priced by the live model, replayed on the day's recorded
# books with each fill and close. Reads S3 only; holds no Betfair key: nothing reaches Betfair, no order is placed.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'UK racing day, YYYY-MM-DD (default today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: greyhound-day-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: The replay
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DAY: ${{ inputs.date }}
        run: |
          ARGS=(--out out/day_replay)
          if [ -n "$DAY" ]; then
            [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date must be YYYY-MM-DD"; exit 1; }
            ARGS+=(--date "$DAY")
          fi
          python -m research.greyhound.day_replay "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/day_replay/report.md ] && cat out/day_replay/report.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-day-replay-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
