name: Backfill Results

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD). Leave empty to resume from last scraped date.'
        required: false
        type: string
      to_date:
        description: 'End date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'
  S3_BUCKET: horseracingresults
  S3_DB_KEY: horse_racing.db

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          python scripts/fetch_data.py \
            --db-only \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_DB_KEY"

      - name: Determine backfill range
        id: range
        run: |
          if [ -n "${{ inputs.from_date }}" ]; then
            FROM="${{ inputs.from_date }}"
          else
            FROM=$(python - <<'EOF'
          import sqlite3
          from datetime import date, timedelta
          conn = sqlite3.connect("horse_racing.db")
          row = conn.execute(
              "SELECT MAX(scrape_date) FROM scrape_log WHERE status = 'ok'"
          ).fetchone()
          last = row[0] if row and row[0] else None
          start = (date.fromisoformat(last) + timedelta(days=1)) if last else date(2010, 1, 1)
          print(start.isoformat())
          EOF
            )
          fi
          if [ -n "${{ inputs.to_date }}" ]; then
            TO="${{ inputs.to_date }}"
          else
            TO=$(date -d yesterday +%Y-%m-%d)
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "Backfilling $FROM to $TO"

      - name: Scrape results from HRB
        env:
          HRB_USERNAME: ${{ secrets.HRB_USERNAME }}
          HRB_PASSWORD: ${{ secrets.HRB_PASSWORD }}
        run: |
          python scraper.py \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --no-backup

      - name: Sync BSPs from Betfair
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: |
          python betfair_sync.py \
            --bsp \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" || echo "BSP sync failed (non-fatal)"

      - name: Upload updated database to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          python scripts/fetch_data.py \
            --upload-db \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_DB_KEY"

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ steps.range.outputs.from }}-to-${{ steps.range.outputs.to }}
          path: scraper.log
          retention-days: 30
