name: Betfair price files (greyhounds, nightly)

# Betfair's greyhound price files (promo.betfair.com/betfairsp/prices, the markets named greyhound*), archived to
# s3://$CAPTURE_BUCKET/betfair_prices_raw/<name> like every other price file, one at a time with a pause between.
# They were archived from the horse racing runner (betfair-prices.yml) until 3 Nov 2026; the owner then kept that
# runner to horse racing alone, so they come from the greyhound runner (the paper models' runner) at night, between
# its day jobs. promo.betfair.com refuses GitHub's own runners, so this runs on the UK server. It only reads the
# site and writes the archive; nothing here bets.

on:
  schedule:
    - cron: '35 22 * * *'    # after the greyhound day (paper-models.yml ends at 21:30 UK); no new file after 05:15 UTC
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Take no new file after this many minutes (at most: until 05:15 UTC).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: greyhound-prices
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
    timeout-minutes: 420
    steps:
      - name: Not on the horse racing runner
        id: runner_guard
        env:
          RUNNER_LABEL: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "this runner is the horse racing runner ($LIVE_RUNNER_LABEL): nothing but horse racing runs there"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (the paper models' environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-paper"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-paper"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt
      - name: Archive the greyhound price files, one file at a time
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          WANT: ${{ inputs.max_minutes }}
        run: |
          # until 05:15 UTC, before the greyhound day starts on this runner at 05:45 UTC
          now=$(date -u +%s)
          day=$(date -u -d "@$now" +%F)
          dawn=$(date -u -d "$day 05:15" +%s)
          if [ "$now" -ge "$dawn" ]; then dawn=$((dawn + 86400)); fi
          MAX=$(( (dawn - now) / 60 ))
          if [ "$MAX" -gt 400 ]; then MAX=400; fi
          if [ -n "$WANT" ]; then
            if ! [[ "$WANT" =~ ^[0-9]+$ ]]; then echo "max_minutes must be a whole number"; exit 1; fi
            if [ "$WANT" -lt "$MAX" ]; then MAX=$WANT; fi
          fi
          echo "Taking new greyhound files for up to $MAX minutes"
          python betfair_prices.py --archive --market-prefix greyhound --max-minutes "$MAX"
