name: Horse paper desk (backs, lays, both sides of the line; no orders)
# The owner, 4 Nov 2026: "Keep the current proven profitable strategy as live. Let's paper trade any others that look
# promising; Backs, Lays, High Volume Trading each side of the line." research/paper/horses.py runs each frozen
# strategy on every new racing day's recorded books (S3 betfair_live/<day>/) through the live trader's code, once
# Betfair's price file for the day is archived, and keeps the ledger in s3://$PRED_BUCKET/paper/horses/. Nothing here
# reaches Betfair: it reads S3 only, on GitHub's runners, never the UK runner, and places no order.
on:
  schedule:
    - cron: '20 6 * * *'     # after the night's price archive (to 04:52 UTC) has the day before yesterday's file
  workflow_dispatch:
    inputs:
      days:
        description: "'pending', a..b or a list of days"
        required: false
        default: pending
        type: string
      backfill_from:
        description: 'With pending: also the days from this one (YYYY-MM-DD), shown apart from the forward test'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: paper-horses
  cancel-in-progress: false
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: The day's paper trades
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRED_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PRED_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DAYS: ${{ inputs.days || 'pending' }}
          BACKFILL: ${{ inputs.backfill_from }}
        run: |
          if ! [[ "$DAYS" =~ ^(pending|[0-9]{4}-[0-9]{2}-[0-9]{2}(\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}|(,[0-9]{4}-[0-9]{2}-[0-9]{2})*))$ ]]; then
            echo "days must be pending, a..b or a list"; exit 1; fi
          ARGS=(--days "$DAYS" --jobs 4 --max-minutes 300)
          if [ -n "$BACKFILL" ]; then
            if ! [[ "$BACKFILL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "backfill_from must be YYYY-MM-DD"; exit 1; fi
            ARGS+=(--backfill-from "$BACKFILL")
          fi
          python -m research.paper.horses "${ARGS[@]}"
