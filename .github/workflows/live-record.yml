name: Betfair market recorder (read-only)

# The owner's ask (30 Sep 2026): keep all the market data the UK server reaches, so the models can learn from it.
# On the UK runner (Betfair refuses GitHub's own runners), read-only, nothing here can place an order:
#   1. the day's GB/IE win and place markets, a snapshot every 5 minutes and every minute in the last hour before
#      each off, until the last race (betfair_recorder.py), with yesterday's settled books (BSP, results), to
#      s3://$CAPTURE_BUCKET/betfair_live/<day>/;
#   2. after the last race, Betfair's UK and Irish price files of the last days (morning and pre-play prices and
#      volumes, BSP, in-play range, for every GB/IE win and place runner), which promo.betfair.com refuses to
#      GitHub's runners too, to s3://$CAPTURE_BUCKET/betfair_prices_raw/, so the night's load has yesterday's.
#      Every other market, and the archive's backfill, is the nightly job betfair-prices.yml.
# The nightly job daily-results.yml, the one job that writes horse_racing.db, loads both.
#
# One runner serves trading too, so this job gives way to it: the 06:55 UTC run records the morning only when the
# owner is not trading live (with TRADING_LIVE=yes the trader records the books it reads itself); the 10:10 UTC run
# takes the rest of the day, after the morning session (it waits for the session to finish when that runs late).

on:
  schedule:
    - cron: '55 6 * * *'     # the whole day, on days the trader is not live
    - cron: '10 10 * * *'    # after the morning session, to the last race
  workflow_dispatch:
    inputs:
      until:
        description: 'last UK time to record, HH:MM'
        required: false
        type: string
        default: '21:30'

permissions:
  contents: read

concurrency:
  group: betfair-recorder
  cancel-in-progress: false

jobs:
  record:
    if: vars.BETFAIR_RUNNER != ''
    runs-on: ${{ vars.BETFAIR_RUNNER }}
    timeout-minutes: 900
    steps:
      - name: Choose the run
        id: run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LIVE: ${{ vars.TRADING_LIVE }}
          UNTIL: ${{ inputs.until }}
        run: |
          GO=true
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '55 6 * * *' ] && [ "$LIVE" = yes ]; then
            echo "The trader is live this morning and records its own books: this run gives way"
            GO=false
          fi
          UNTIL="${UNTIL:-21:30}"
          if ! [[ "$UNTIL" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then echo "until must be HH:MM"; exit 1; fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.run.outputs.go == 'true'

      - name: Python on the UK server
        # the same Python 3.12 environment the trader uses (live-trade.yml)
        if: steps.run.outputs.go == 'true'
        run: |
          VENV="$HOME/.venvs/ashcroft"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.run.outputs.go == 'true'
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt

      - name: Yesterday's settled books (BSP, results)
        if: steps.run.outputs.go == 'true'
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          Y="$(TZ=Europe/London date -d yesterday +%F)"
          timeout 600 python betfair_recorder.py --final --date "$Y"
          # the records of their own (the owner's ask of 3 Oct: the other place markets and the greyhounds)
          timeout 300 python betfair_recorder.py --final --tag other_place --date "$Y" || true
          timeout 300 python betfair_recorder.py --final --event-type 4339 --tag greyhound --date "$Y" || true

      - name: Record the day's markets to the last race
        if: steps.run.outputs.go == 'true'
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          UNTIL: ${{ steps.run.outputs.until }}
        # Beside the win and place record, two of their own (books_other_place.csv, books_greyhound.csv; the nightly
        # load reads neither): the 2/3/4 TBP and each-way markets for the place model, and the GB/IE greyhound win
        # and place markets for the greyhound model. Either failing leaves the main record as it was.
        run: |
          python betfair_recorder.py --record --final --until "$UNTIL" --market-types OTHER_PLACE,EACH_WAY \
            --tag other_place > other_place.log 2>&1 &
          OTHER=$!
          python betfair_recorder.py --record --final --until "$UNTIL" --event-type 4339 --tag greyhound \
            --market-types WIN,PLACE > greyhound.log 2>&1 &
          DOGS=$!
          rc=0
          python betfair_recorder.py --record --final --until "$UNTIL" || rc=$?
          wait "$OTHER" || echo "::warning::the other place markets' record ended with an error"
          wait "$DOGS" || echo "::warning::the greyhound record ended with an error"
          tail -n 3 other_place.log greyhound.log || true
          exit "$rc"

      # After the last race, so it never costs a snapshot: the UK and Irish files of the last days, for the night's
      # load (betfair-prices.yml takes every market and the backfill from 22:30 UTC). One file at a time, from the
      # listing, each stored only when it is new or Betfair has rewritten it.
      - name: Betfair's UK and Irish price files of the last days, to S3
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: timeout 480 python betfair_prices.py --archive --market ukwin,ukplace,irewin,ireplace --refresh-days 2 --max-minutes 5

      # Which markets Betfair lists on the next day's racing beside win and place (match bets, the other place markets,
      # forecasts): one read of the catalogue, any type, printed for the research (the owner's question of 2 Oct on
      # AvB markets, which the price files do not hold).
      - name: Market types on tomorrow's racing (census, read-only)
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: timeout 180 python betfair_recorder.py --census --date "$(TZ=Europe/London date -d tomorrow +%F)"

      # The owner's ask (4 Oct): would backs taken the evening before close better than the morning's? Tomorrow's
      # GB/IE win markets, each snapshotted every ten minutes for 45 minutes, kept apart from the day's own record
      # (s3://.../betfair_live/<tomorrow>/books_evening.csv.gz; the nightly load reads only the day's writers).
      # Read-only: no order is placed.
      - name: Tomorrow's win markets the evening before (read-only)
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: >-
          timeout 3300 python betfair_recorder.py --record --date "$(TZ=Europe/London date -d tomorrow +%F)"
          --tag evening --market-types WIN --every 600 --for-minutes 45

      # The ante-post win markets (the big races weeks or months ahead), once a day: for the ante-post model.
      - name: Ante-post markets (one snapshot, read-only)
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: timeout 300 python betfair_recorder.py --antepost

      # Every sport's open markets of the next 24 hours, their types and the money matched on them so far, read after
      # the last race each day: which sport to model next (the owner's ask of 3 Oct). One read, about a minute.
      - name: Every sport's markets (census, read-only)
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: timeout 180 python betfair_recorder.py --census-sports
