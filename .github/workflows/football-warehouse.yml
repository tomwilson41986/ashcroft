name: Football data warehouse (Betfair price history to analysis tables, S3)

# The racing² football data warehouse (docs/football_data_platform.md). Every bundle of Betfair Historic Data listed
# in football/warehouse/bundles.json is ingested once into bronze (the raw files as a table); silver (market, runner,
# definition, spell, tick) and gold (event, checkpoint grid, implied goals, price-path features, inferred goals, the
# move panel, market-implied ratings, club marts) are built for the partitions that changed; the events are linked to
# API-Football fixtures; and the data-quality report decides the run (a failed hard check fails the job).
# S3 only: nothing here logs in to Betfair, reads a live price or bets. On GitHub's runners. A bundle's download
# link is read from the FOOTBALL_BUNDLE_URLS secret ({"<bundle name>": "<link>"}), not from the repository.

on:
  # nightly (the owner, 24 Nov 2026: "automate the download"): the last ten days from Betfair's Historic Data API,
  # then silver, gold, link and checks, so the paper tests see each day's matches within a day or two. Betfair
  # refuses logins from GitHub's runners (403 at identitysso.betfair.com, run 45413693273), so the fetch runs on the
  # owner's paper-models runner in its gap between the greyhound archive (ends by 05:15 UTC) and the greyhound day
  # (05:45 UTC): the owner's choice, 24 Nov 2026
  schedule:
    - cron: '15 5 * * *'      # fetch on the paper-models runner 05:15-05:38 UTC, then build on GitHub's runner
  workflow_dispatch:
    inputs:
      force:
        description: 'rebuild every partition, silver and gold'
        required: false
        type: boolean
        default: false
      models:
        description: 'score the closing-price model on the built tables'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: football-warehouse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
    timeout-minutes: 30
    steps:
      - name: Not on the horse racing runner
        env:
          RUNNER_LABEL: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "this runner is the horse racing runner ($LIVE_RUNNER_LABEL): nothing but horse racing runs there"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (its own environment, so the warehouse's pins never touch the greyhound jobs')
        run: |
          VENV="$HOME/.venvs/ashcroft-football-data"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-paper"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r football/warehouse/requirements.txt
      - name: The last ten days' soccer files from Betfair's Historic Data API into bronze (read-only; no orders)
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          # done by 05:38 UTC whatever happens: the greyhound day starts on this runner at 05:45 UTC
          now=$(date -u +%s)
          stop=$(date -u -d "$(date -u +%F) 05:38" +%s)
          MAX=$(( (stop - now) / 60 ))
          if [ "$MAX" -le 0 ] || [ "$MAX" -gt 20 ]; then MAX=20; fi
          mkdir -p out
          timeout $(( MAX * 60 + 120 )) python -m football.warehouse historic --days 10 --max-minutes "$MAX" | tee out/historic.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: football-historic-fetch
          path: out/
          if-no-files-found: ignore

  warehouse:
    needs: fetch
    if: ${{ !cancelled() }}                # the bundles and the build run whether or not the fetch did
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash                # -eo pipefail: a step that pipes to tee fails when its command does
    env:
      FOOTBALL_BUNDLE_URLS: ${{ secrets.FOOTBALL_BUNDLE_URLS }}    # {"<bundle name>": "<link>"}; never printed
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
      CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
      CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r football/warehouse/requirements.txt
      - name: Bundles into bronze (each once; a bundle already ingested is not downloaded again)
        run: |
          mkdir -p out
          python -m football.warehouse ingest-queue | tee out/ingest.json
      - name: Silver and gold (the partitions whose inputs or code changed)
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m football.warehouse build $FORCE | tee out/build.json
      - name: Link events to API-Football fixtures; check inferred goals against real goal minutes
        continue-on-error: true
        run: python -m football.warehouse.link run | tee out/link.json
      - name: Data-quality report (a failed hard check fails the run)
        id: quality
        run: python -m football.warehouse check --markdown out/quality.md > out/quality.json
      - name: Headline numbers (each one query over the tables)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m football.warehouse facts --out out/facts.json > /dev/null
      - name: Closing-price model on the move panel (development read; nothing is traded)
        if: ${{ !cancelled() && inputs.models }}
        continue-on-error: true
        run: python -m research.open_close.football_bf_close_model --out-json out/bf_close_model.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Football data warehouse"
            [ -f out/quality.md ] && cat out/quality.md
            for f in out/ingest.json out/facts.json out/link.json out/bf_close_model.json out/build.json; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"; echo '```'; head -c 20000 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: football-warehouse
          path: out/
          if-no-files-found: ignore
