name: Horse racing minute files (Betfair Historic Data, BASIC, read-only)

# The owner, 12 Nov 2026: "yes, fetch the minute files". The UK/IE WIN markets' BASIC stream files (the last traded
# price each minute of every runner, the withdrawn ones too), raw to S3, newest month first, each file once: the
# ghost-run block's data (reports/discovery_1111.md 4.1). Research only; no order call; the delayed key's login.
# On the data runner (the service refuses some countries), after the other sports' fetch, never beside it.

on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Minutes of fetching at most'
        default: '100'

permissions:
  contents: read

concurrency:
  group: other-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ${{ vars.DATA_RUNNER || 'data' }}
    timeout-minutes: 130
    steps:
      - name: Not on the horse racing runner
        env:
          RUNNER_LABEL: ${{ vars.DATA_RUNNER || 'data' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "DATA_RUNNER is the live trader's runner ($LIVE_RUNNER_LABEL): this fetch does not run beside it"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (its own environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-data"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-data"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt
      - name: Fetch the minute files
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '100' }}
        run: timeout 7200 python -m research.horse_minute_files --max-minutes "$MAX_MINUTES"
