name: Paper trading
# The forward test of the early-price edge (TRADING.md): each morning the trader reads Betfair's
# live win markets (read-only) and simulates every order against the book on the 06:00 run's
# prices; each evening it settles the day's ledger from the closed markets and emails a summary.
# Nothing is placed on the exchange: the trading package has no order-placing code.
# Stop it for a day by creating s3://<bucket>/trading/STOP; change a setting without a commit
# through a repository variable TRADING_<NAME> (trading/config.py).
on:
  schedule:
    - cron: '50 6 * * *'    # trade: the window is 08:00-11:00 UK and the trader waits for it
    - cron: '45 21 * * *'   # settle: after the last race
  workflow_dispatch:
    inputs:
      mode:
        description: 'trade (the morning session) or settle (the evening)'
        type: choice
        options: [trade, settle]
        default: trade
      date:
        description: 'UK racing day, YYYY-MM-DD (default today)'
        required: false
        type: string
      until:
        description: 'trade: stop at this UK time, HH:MM'
        required: false
        type: string
        default: '11:05'

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[pipeline]" && pip install -r requirements.txt

      - name: Choose the session
        id: session
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DAY: ${{ inputs.date }}
          UNTIL: ${{ inputs.until }}
        run: |
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = '45 21 * * *' ]; then MODE=settle; else MODE=trade; fi
            DAY=""; UNTIL="11:05"
          fi
          case "$MODE" in trade|settle) ;; *) echo "mode must be trade or settle"; exit 1 ;; esac
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date must be YYYY-MM-DD"; exit 1; fi
          UNTIL="${UNTIL:-11:05}"
          if ! [[ "$UNTIL" =~ ^[0-2][0-9]:[0-5][0-9]$ ]]; then echo "until must be HH:MM"; exit 1; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"

      - name: Write the Betfair certificate
        # Optional: certificate login when the secrets exist, otherwise the client logs in
        # with the username and password.
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            mkdir -p "$HOME/.betfair/certs"
            printf '%s\n' "$BETFAIR_CERT" > "$HOME/.betfair/certs/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$HOME/.betfair/certs/betfair.key"
            chmod 600 "$HOME/.betfair/certs/betfair.key"
            echo "BETFAIR_CERT_FILE=$HOME/.betfair/certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$HOME/.betfair/certs/betfair.key" >> "$GITHUB_ENV"
          fi

      - name: Paper trade or settle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          # Settings without a commit (empty means the file's value): trading/config.py
          TRADING_STRATEGY: ${{ vars.TRADING_STRATEGY }}
          TRADING_STAKING: ${{ vars.TRADING_STAKING }}
          TRADING_UNIT: ${{ vars.TRADING_UNIT }}
          TRADING_TARGET: ${{ vars.TRADING_TARGET }}
          TRADING_MARGIN: ${{ vars.TRADING_MARGIN }}
          TRADING_TRADE_FROM: ${{ vars.TRADING_TRADE_FROM }}
          TRADING_TRADE_UNTIL: ${{ vars.TRADING_TRADE_UNTIL }}
          TRADING_BANK: ${{ vars.TRADING_BANK }}
          TRADING_MAX_STAKE: ${{ vars.TRADING_MAX_STAKE }}
          TRADING_DAILY_STOP_LOSS: ${{ vars.TRADING_DAILY_STOP_LOSS }}
          TRADING_MIN_MARKET_MATCHED: ${{ vars.TRADING_MIN_MARKET_MATCHED }}
          MODE: ${{ steps.session.outputs.mode }}
          DAY: ${{ steps.session.outputs.day }}
          UNTIL: ${{ steps.session.outputs.until }}
        run: |
          ARGS=()
          if [ -n "$DAY" ]; then ARGS+=(--date "$DAY"); fi
          if [ "$MODE" = settle ]; then
            python auto_trade.py --settle "${ARGS[@]}"
          else
            python auto_trade.py --until "$UNTIL" "${ARGS[@]}"
          fi

      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-${{ steps.session.outputs.mode }}-${{ github.run_id }}
          path: out/trading/
          if-no-files-found: ignore
          retention-days: 90
