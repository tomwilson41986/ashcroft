name: Greyhound live (model, prices, settlement)

# The greyhound trading model (the owner's ask, 6 Oct 2026: "bring the real money trades live", "focus on the
# trading model"; greyhound/live.py). This workflow is the half on GitHub's runners (S3, no Betfair):
#   - the live model: from 10 Nov 2026 the stack (greyhound/stack_model.py, the owner: "move the live greyhound pricing
#     to the new model"), fitted on the 29 months to yesterday, without the features built on the day's weigh-in
#     (unknown in the morning); weekly (about two hours), and once now if no model is stored;
#   - today's prices: the cards from the recorder's greyhound catalogue (S3), priced from the dogs' earlier days, to
#     sources/greyhound/live/predictions/<day>.csv, hourly as the day's markets are listed;
#   - yesterday's settlement from the recorder's settled books (the BSP and the winner).
# The orders are placed by the trader on the UK runner, beside the horse trader (live-trade.yml), with real money
# only when the repository variable GREYHOUND_LIVE is 'yes'. Stop new bets: the S3 object greyhound/STOP.

on:
  schedule:
    - cron: '41 4 * * 0'     # Sunday: refit the live model
    - cron: '21 7-19 * * *'  # prices, hourly from the morning's catalogue (the recorder starts 06:50-06:55 UTC):
                             # a race listed late, or a reserve in, is priced within the hour (the trader reloads)
    - cron: '56 11 * * *'    # settle the last days (the settled books are read by 10:10 UTC)
    - cron: '*/10 10-21 * * *'   # the paper trader's running table, a row per market, every 10 minutes of the racing
  workflow_dispatch:
    inputs:
      task:
        description: 'predict, train, settle, check-card (a past day: the card against the results), coverage (the day''s races against what was priced and decided), or running (the paper trader''s day so far, a row per market)'
        type: choice
        options: [predict, train, settle, check-card, coverage, running]
        default: predict
      date:
        description: 'UK racing day, YYYY-MM-DD (default today)'
        required: false
        type: string
  push:
    branches: ['claude/dreamy-dirac-*']
    paths:
      - 'greyhound/live.py'
      - 'greyhound/card.py'
      - '.github/workflows/greyhound-live.yml'

permissions:
  contents: read

concurrency:
  # a group per task: from 10 Nov 2026 the hourly prices build the metrics tables with the card (about 50 minutes),
  # and must not hold up the running table every 10 minutes, nor the Sunday refit
  group: greyhound-live-${{ github.event.schedule || inputs.task || 'predict' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Free disk space
        # GitHub's ubuntu-26.04 runners keep /mnt on the root disk: the swap file left no room and the job died
        # with "No space left on device" (greyhound-live.yml run 43386968806, 13 Nov 2026). Unused tool caches go first.
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1; free -g | sed -n 2,3p
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: Model, prices or settlement
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TASK: ${{ inputs.task }}
          DAY: ${{ inputs.date }}
        run: |
          if [ "$EVENT" = schedule ]; then
            case "$SCHEDULE" in
              '41 4 * * 0') TASK=train ;;
              '56 11 * * *') TASK=settle ;;
              '*/10 10-21 * * *') TASK=running ;;
              *) TASK=predict ;;
            esac
            DAY=""
          fi
          set -o pipefail                    # a failing step fails the run, through the tee
          TASK="${TASK:-predict}"
          case "$TASK" in predict|train|settle|check-card|coverage|running) ;; *) echo "task must be predict, train, settle, check-card, coverage or running"; exit 1 ;; esac
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date must be YYYY-MM-DD"; exit 1; fi
          mkdir -p out
          # the live model from 10 Nov 2026 (greyhound/stack_model.py) has neural models: PyTorch on the CPU, pinned
          case "$TASK" in train|predict) pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu ;; esac
          ARGS=()
          if [ -n "$DAY" ]; then ARGS+=(--date "$DAY"); fi
          case "$TASK" in
            train)   python -m greyhound.live --train "${ARGS[@]}" | tee out/greyhound_live.json ;;
            predict) python -m greyhound.live --train-if-missing --predict "${ARGS[@]}" | tee out/greyhound_live.json ;;
            settle)  python -m greyhound.live --settle --days 3 "${ARGS[@]}" | tee out/greyhound_live.json ;;
            check-card) python -m greyhound.live --check-card "${ARGS[@]}" | tee out/greyhound_live.json ;;
            coverage) python -m greyhound.live --coverage "${ARGS[@]}" | tee out/greyhound_live.json ;;
            running) python -m greyhound.live --running --out out/greyhound_running.md "${ARGS[@]}" | tee out/greyhound_live.json
                     cat out/greyhound_running.md ;;   # the table in the log as well as the summary
          esac
      - name: Summary
        if: always()
        run: |
          [ -f out/greyhound_running.md ] && cat out/greyhound_running.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/greyhound_live.json ] && { echo '```'; head -c 30000 out/greyhound_live.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
