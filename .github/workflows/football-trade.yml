name: Football (the trader, every match on Betfair, the book records, the line-ups)

# The owner, 3 Nov 2026: paper-trade every football match on Betfair from the live feed (prices, depth, traded money),
# keeping the live application key in betting use with small real stakes, because Betfair counts a live key read
# without the intention to bet as read-only access and may deactivate it.
#
# Every football process on the UK server runs here, on the football runner, apart from greyhounds and horse racing
# (the owner, 3 Nov 2026). The trader (football/live.py --trade --all-games):
#   - the football model's own decisions (MATCH_ODDS and OVER_UNDER_25 in its ten countries). With FOOTBALL_LIVE=yes
#     these are real bets at football/live_config.json's live_limits: GBP2 a bet, GBP2 a match, GBP20 a day.
#     Otherwise they are paper;
#   - every football market on Betfair recorded and paper-traded beside it (football/exchange_feed.py,
#     football/paper_book.py): depth a side, the traded ladder, sized entries at each checkpoint before the off,
#     resting orders against the recorded queue, the close, Betfair's result. It places nothing.
#
# Beside it, read-only on the delayed key: the Betfair football book records (betfair_recorder.py, tags football_<C>,
# football_eve_<C>, football_coll_<C>: the books the pre-registered football paper trials are scored at) and the
# API-Football line-ups and injuries collector, then its tables. All moved here from paper-models.yml on 3 Nov 2026.
# The key (the owner, 4 Nov 2026: "use live key", "do not pass betfair thresholds"): the live application key to the
# trader's process alone, which reads every football market through a request throttle under Betfair's limits
# (football/exchange_feed.py Throttle); it bets only when the repository variable FOOTBALL_LIVE is 'yes', otherwise
# paper. The book records and the line-ups collector stay on the delayed key, so no market is read twice on the live key.
# The runner: its own self-hosted runner on the UK server (Betfair refuses GitHub's runners), labelled
# vars.FOOTBALL_RUNNER (default 'football'). Not the live horse trader's runner, and not the paper models' runner
# (one job a runner: a shared runner would hold one job behind the other all day).
# To stop new bets within a minute: the S3 object football/STOP (or trading/STOP). To stop everything: cancel the run.
# Ledgers: s3://$CAPTURE_BUCKET/sources/football/live/<paper|live>/<day>/; the record and the paper lines:
# s3://$CAPTURE_BUCKET/sources/football/exchange/<match day>/. Settled by football-model.yml.

on:
  schedule:
    - cron: '40 5 * * *'      # 23.5 hours from 05:40 UTC: every kick-off of the day, worldwide
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ${{ vars.FOOTBALL_RUNNER || 'football' }}
    timeout-minutes: 1440
    steps:
      - name: Not on another job's runner
        id: runner_guard
        env:
          FOOTBALL_RUNNER_LABEL: ${{ vars.FOOTBALL_RUNNER || 'football' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
          PAPER_RUNNER_LABEL: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$FOOTBALL_RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "FOOTBALL_RUNNER is the live horse trader's runner ($LIVE_RUNNER_LABEL): football does not run there"
            exit 1
          fi
          if [ "$FOOTBALL_RUNNER_LABEL" = "$PAPER_RUNNER_LABEL" ]; then
            echo "FOOTBALL_RUNNER is the paper models' runner ($PAPER_RUNNER_LABEL): give football its own"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (its own environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-football"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-football"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt
      - name: Write the Betfair certificate (its own folder)
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            D="$HOME/.betfair/certs-football"
            mkdir -p "$D"
            printf '%s\n' "$BETFAIR_CERT" > "$D/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$D/betfair.key"
            chmod 600 "$D/betfair.key"
            echo "BETFAIR_CERT_FILE=$D/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$D/betfair.key" >> "$GITHUB_ENV"
          fi
      - name: Football (the trader, every match recorded and paper-traded, the book records, the line-ups)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          # the delayed key: every process here but the trader (the live key, the owner, 4 Nov 2026)
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
          FOOTBALL_LIVE: ${{ vars.FOOTBALL_LIVE || 'no' }}
          # API-Football (read-only data, not a betting key): the line-ups and injuries collector
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set +e
          FBKEY="$BETFAIR_APP_KEY"
          LIVEFLAG=""
          # the owner, 4 Nov 2026: "use live key" ("do not pass betfair thresholds": the feed's Throttle): the trader's
          # process reads on the live key; it bets only with FOOTBALL_LIVE=yes
          if [ -n "$BETFAIR_LIVE_APP_KEY" ]; then FBKEY="$BETFAIR_LIVE_APP_KEY"; fi
          if [ "$FOOTBALL_LIVE" = yes ] && [ -n "$BETFAIR_LIVE_APP_KEY" ]; then LIVEFLAG="--live"; fi
          if [ -n "$LIVEFLAG" ]; then echo "football: real stakes on, the live key's feed"; else echo "football: paper, the live key's feed"; fi
          # the Betfair football books with their sizes (read-only, the delayed key; the unmodified betfair_recorder.py,
          # tag football_<country>): today's MATCH_ODDS and OVER_UNDER_25 in the leagues football-data covers, every 15
          # minutes and every 2 in the hour before kick-off, and tomorrow's the evening before. The prices the
          # pre-registered football paper trials are scored at (research/open_close/football_paper_trial.py).
          # Moved here from paper-models.yml on 3 Nov 2026, the files and their S3 keys unchanged.
          TOMORROW=$(TZ=Europe/London date -d tomorrow +%F)
          FBREC=()
          for C in GB ES IT DE FR NL BE PT TR GR; do
            python betfair_recorder.py --record --until 21:30 --event-type 1 --market-types MATCH_ODDS,OVER_UNDER_25 \
              --countries "$C" --tag "football_$C" --every 900 --every-near 120 \
              > "$RUNNER_TEMP/football_$C.log" 2>&1 &
            FBREC+=($!)
            python betfair_recorder.py --record --date "$TOMORROW" --evening 17:00-21:30 --event-type 1 \
              --market-types MATCH_ODDS,OVER_UNDER_25 --countries "$C" --tag "football_eve_$C" --every 1800 \
              > "$RUNNER_TEMP/football_eve_$C.log" 2>&1 &
            FBREC+=($!)
          done
          # the books at football-data's collection moment for the matches the records above cannot reach then: on
          # Fridays from 16:55 UK the markets of Sunday and Monday, on Tuesdays from 12:55 UK those of Wednesday and
          # Thursday, for 50 minutes, tag football_coll_<C>
          coll_record() {
            NOW=$(date +%s); START=$(TZ=Europe/London date -d "today $1" +%s)
            [ "$START" -gt "$NOW" ] && sleep $((START - NOW))
            for O in $2; do
              D=$(TZ=Europe/London date -d "+$O day" +%F)
              for C in GB ES IT DE FR NL BE PT TR GR; do
                python betfair_recorder.py --record --date "$D" --for-minutes 50 --event-type 1 \
                  --market-types MATCH_ODDS,OVER_UNDER_25 --countries "$C" --tag "football_coll_$C" --every 600 \
                  > "$RUNNER_TEMP/football_coll_${O}_$C.log" 2>&1 &
              done
            done
            wait
          }
          DOW=$(TZ=Europe/London date +%u)
          if [ "$DOW" = 5 ]; then coll_record 16:55 "2 3" & FBREC+=($!); fi
          if [ "$DOW" = 2 ]; then coll_record 12:55 "1 2" & FBREC+=($!); fi
          # the line-ups and injuries (sources/api_football_lineups.py, API-Football, read-only): each match of the 22
          # divisions and the high-money leagues (lineup_league_ids: the UEFA club competitions, Brazil's Serie A, the
          # AFC Champions League Two) polled from 75 minutes before kick-off until both elevens are out, once more at T-10; the day's
          # injuries every 3 hours. It places nothing.
          python -m sources.api_football_lineups --collect --until 21:30 > "$RUNNER_TEMP/football_lineups.log" 2>&1 &
          FBL=$!
          # the trader, in the foreground: its decisions (real only with FOOTBALL_LIVE=yes) and every match on Betfair
          # recorded and paper-traded beside them
          BETFAIR_APP_KEY="$FBKEY" timeout 1420m python -m football.live --trade --all-games --hours 23.5 $LIVEFLAG
          FC=$?; echo "football trader exited $FC"
          for P in "${FBREC[@]}"; do wait "$P"; done
          echo "football book records exited"; tail -n 2 "$RUNNER_TEMP"/football_*.log
          wait "$FBL"; LC=$?; echo "football line-ups exited $LC"; tail -n 3 "$RUNNER_TEMP/football_lineups.log"
          [ "$LC" = 0 ] || echo "::warning::the football line-ups collector exited $LC (its log above)"
          [ "$FC" = 0 ]
      - name: Football line-up tables
        # rebuilt whole from the raw polls (safe to rerun); a failure here costs no data
        if: ${{ !cancelled() && steps.runner_guard.outcome == 'success' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: timeout 900 python -m sources.api_football_lineups --build
      - name: Keep the day's files
        if: ${{ always() && steps.runner_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: football-trade
          path: |
            ~/.ashcroft/football/paper/
            ~/.ashcroft/football/live/
          retention-days: 7
          if-no-files-found: ignore
