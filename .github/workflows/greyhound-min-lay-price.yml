name: Greyhound early lay, a minimum lay price (read-only)

# The registered test greyhound-min-lay-price-1113 (research/greyhound/min_lay_price.py; the owner, 13 Nov 2026: "Yes
# run the minimum-lay-price test"): the forward test's rule on its own procedure, its matched lays split at a price of
# 5. Reads the recorded books and the forward test's prices from S3; nothing reaches Betfair, no order is placed.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'first day, YYYY-MM-DD (default 2026-10-06, the first recorded books)'
        required: false
        type: string
      date_to:
        description: 'last day, YYYY-MM-DD (default yesterday, UTC)'
        required: false
        type: string
      source:
        description: "the books: retimed (the forward test's), recorder or live"
        required: false
        type: choice
        options: ['retimed', 'recorder', 'live']
        default: 'retimed'

permissions:
  contents: read

concurrency:
  group: greyhound-min-lay-price
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Free disk space
        # GitHub's ubuntu-26.04 runners keep /mnt on the root disk: the swap file left no room and the job died
        # with "No space left on device" (greyhound-live.yml run 43386968806, 13 Nov 2026). Unused tool caches go first.
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1; free -g | sed -n 2,3p
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: The test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          FROM: ${{ inputs.date_from }}
          TO: ${{ inputs.date_to }}
          SOURCE: ${{ inputs.source || 'retimed' }}
        run: |
          mkdir -p out
          ARGS=(--out out/min_lay_price --source "$SOURCE")
          for v in "$FROM" "$TO"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "dates must be YYYY-MM-DD"; exit 1; fi
          done
          if [ -n "$FROM" ]; then ARGS+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then ARGS+=(--to "$TO"); fi
          python -m research.greyhound.min_lay_price "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/min_lay_price.md ] && head -c 60000 out/min_lay_price.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-min-lay-price-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
