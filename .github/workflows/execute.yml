name: Execute Bets
# The old order path (pipeline.execute; TRADING.md: "disabled by hand on 19 Aug ... places live bets by default and
# has known faults ... It should stay disabled"). OPS-9, 24 Nov 2026: its schedule is removed from the file (it ran
# every 30 minutes 10:00-20:30 UTC with DRY_RUN false, outside the owner's limits and trading/STOP), and a manual
# run is a dry run unless dry_run is unticked. The live trader is live-trade.yml (auto_trade.py).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        type: boolean
        default: true

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[pipeline]" && pip install -r requirements.txt

      - name: Write Betfair certs
        run: |
          mkdir -p ~/.betfair/certs
          echo "${{ secrets.BETFAIR_CERT }}" > ~/.betfair/certs/betfair.crt
          echo "${{ secrets.BETFAIR_KEY }}" > ~/.betfair/certs/betfair.key

      - name: Execute bets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_CERT_FILE: ~/.betfair/certs/betfair.crt
          BETFAIR_KEY_FILE: ~/.betfair/certs/betfair.key
          DRY_RUN: ${{ format('{0}', inputs.dry_run) == 'false' && 'false' || 'true' }}   # dry unless unticked
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
        run: python -m pipeline.execute
