name: H2H Fetch Horse Form

on:
  workflow_dispatch:
    inputs:
      horse_ids:
        description: 'Comma-separated horseracebase horse IDs'
        required: false
        type: string
        default: '397142,399032'
  push:
    paths:
      - 'data/h2h/request.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml python-dotenv

      - name: Determine horse IDs
        id: ids
        run: |
          if [ -n "${{ inputs.horse_ids }}" ]; then
            IDS="${{ inputs.horse_ids }}"
          elif [ -f data/h2h/request.txt ]; then
            IDS=$(tr -d '[:space:]' < data/h2h/request.txt)
          else
            IDS="397142,399032"
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Fetch horse form pages
        env:
          HRB_USERNAME: ${{ secrets.HRB_USERNAME }}
          HRB_PASSWORD: ${{ secrets.HRB_PASSWORD }}
        run: |
          python scripts/fetch_horse_form.py \
            --ids "${{ steps.ids.outputs.ids }}" \
            --out-dir data/h2h

      - name: Commit fetched pages to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/h2h/
          git diff --cached --quiet || git commit -m "Add fetched horse form pages for H2H simulation"
          git push
