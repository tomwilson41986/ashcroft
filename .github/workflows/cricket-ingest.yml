name: Cricket - Cricsheet ingest

# The racing² cricket trader, Phase 0 (reports/cricket/README.md; build spec 5.1). Read-only: nothing here reaches
# Betfair or the horse jobs (tests/test_cricket_guards.py).
#   - Cricsheet's all-matches JSON zip and people register, raw and untouched, to
#     s3://$CAPTURE_BUCKET/sources/cricket/raw/cricsheet/<day>/ (a file identical to the last copy is not stored again);
#   - the tables (matches, innings, deliveries, players, venues, people_register) to sources/cricket/tables/;
#   - the ingest report (rows in vs out per format, duplicates, nulls, date range) to sources/cricket/reports/ and the
#     run's artifact. The job fails when the report's check fails.
# Aurora is not provisioned (it waits on the owner's go), so no database load here yet. Then the pre-match Benter test
# against Betfair's close (cricket/model/benter.py), which says no data found until the BASIC cricket table is held.

on:
  schedule:
    - cron: '47 4 * * *'     # Cricsheet publishes through the evening UK time
  workflow_dispatch:
    inputs:
      with_csv:
        description: 'also fetch the CSV (Ashwin) zip, raw only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cricket-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies (pinned)
        run: pip install -r cricket/requirements.txt
      - name: Fetch, build, report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          WITH_CSV: ${{ inputs.with_csv && '--with-csv' || '' }}
        run: |
          python -m cricket.ingest.cricsheet --fetch $WITH_CSV --build --report --report-dir out | tee ingest.log
      - name: Benter test against Betfair's close (reads S3; no data found until the BASIC cricket table is held)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: python -m cricket.model.benter --out out
      - name: Report to the run summary
        if: ${{ !cancelled() }}
        run: cat out/*.md >> "$GITHUB_STEP_SUMMARY" || echo "no report written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cricket-ingest-report
          path: |
            out/
            ingest.log
