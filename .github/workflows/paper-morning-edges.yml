name: Morning edges paper trader (quick return, steamer model, Timeform improvers; no orders)

# The owner, 4 Nov 2026: "set this up as a paper trader model. Ensure it doesn't bet before 10:00 so it doesnt take
# prices from the live trader". research/paper/morning_edges.py replays each racing day once Betfair's price file is
# archived: the day's selections (from the card and earlier days only), backed WIN and PLACE at the recorded 10:00 UK
# book (never earlier), the live trader's horses left alone, held to the result; tf_pb_bsp at BSP. Spec and gate:
# docs/paper_trader_morning_edges.md. Nothing here reaches Betfair: no Betfair key, GitHub's runner, S3 and the HRB
# database only. The Timeform cache is kept in S3 from the Railway backend (APIData_Table2), the recent months only
# after the first run.

on:
  schedule:
    - cron: '40 6 * * *'     # after the night's price archive and the HRB results
  workflow_dispatch:
    inputs:
      days:
        description: "'pending', a..b or a list of days"
        required: false
        default: pending
        type: string
      backfill_from:
        description: 'With pending: also the days from this one (YYYY-MM-DD), shown apart from the forward test'
        required: false
        type: string
      train:
        description: 'Fit and freeze the steamer model (once, before the forward start)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-morning-edges
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download historic database from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: python scripts/fetch_data.py --db-only --s3-bucket horseracingresults --s3-key horse_racing.db
      - name: Fit and freeze the steamer model
        if: ${{ inputs.train }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRED_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PRED_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: python -m research.paper.morning_edges --train --cutoff 2026-10-31
      - name: The day's paper trades
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRED_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PRED_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DAYS: ${{ inputs.days || 'pending' }}
          BACKFILL: ${{ inputs.backfill_from }}
        run: |
          if ! [[ "$DAYS" =~ ^(pending|[0-9]{4}-[0-9]{2}-[0-9]{2}(\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}|(,[0-9]{4}-[0-9]{2}-[0-9]{2})*))$ ]]; then
            echo "days must be pending, a..b or a list"; exit 1; fi
          ARGS=(--days "$DAYS")
          if [ -n "$BACKFILL" ]; then
            if ! [[ "$BACKFILL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "backfill_from must be YYYY-MM-DD"; exit 1; fi
            ARGS+=(--backfill-from "$BACKFILL")
          fi
          python -m research.paper.morning_edges "${ARGS[@]}" | tee report.txt
          { echo '```'; cat report.txt | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
