name: Football warehouse tests

# The unit tests of the racing² football data warehouse and of the models built on it, and the guards that keep the
# live horse jobs apart from every other model (tests/test_workflow_guards.py). On GitHub's runners, with no
# secret: nothing here reads S3 or Betfair, and nothing is written anywhere.

on:
  pull_request:
    paths:
      - 'football/**'
      - 'research/open_close/football_bf_*'
      - 'tests/test_football_*'
      - 'tests/test_workflow_guards.py'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r football/warehouse/requirements.txt pytest pyyaml

      - name: The guards between the live horse jobs and every other model
        run: python -m pytest -q tests/test_workflow_guards.py

      - name: The football warehouse and the models on it
        run: python -m pytest -q tests/test_football_warehouse*.py tests/test_football_bf_*.py
