name: Live Betfair odds (read-only)

# A snapshot of today's British and Irish win markets on the Betfair exchange for the owner's staking
# (scripts/score_live_prices.py scores it): best back and lay with their sizes, last traded, the market's
# and each runner's matched money. Read-only: a login and market data, nothing that can place an order.
# Push-triggered on the research branch (a workflow only on a branch cannot be dispatched): edit
# research/live/snapshot.txt and push to take one.

on:
  push:
    branches: ['claude/happy-ritchie-*']
    paths:
      - 'research/live/snapshot.txt'
      - '.github/workflows/live-odds.yml'

permissions:
  contents: read

concurrency:
  group: live-odds
  cancel-in-progress: false

jobs:
  snapshot:
    # Betfair refuses API logins from the USA, where GitHub's own runners are (a 403 at the login, run 2): the job
    # has to run on a machine in the UK or Ireland, registered as a self-hosted runner and named by the repository
    # variable BETFAIR_RUNNER, e.g. 'self-hosted'. The repository is public, so that machine should be a dedicated
    # server, not a personal computer, with workflow runs from outside contributors held for approval.
    runs-on: ${{ vars.BETFAIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[pipeline]" && pip install -r requirements.txt

      - name: Write the Betfair certificate
        # Optional: certificate login when the secrets exist, otherwise the username and password.
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            mkdir -p "$HOME/.betfair/certs"
            printf '%s\n' "$BETFAIR_CERT" > "$HOME/.betfair/certs/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$HOME/.betfair/certs/betfair.key"
            chmod 600 "$HOME/.betfair/certs/betfair.key"
            echo "BETFAIR_CERT_FILE=$HOME/.betfair/certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$HOME/.betfair/certs/betfair.key" >> "$GITHUB_ENV"
          fi

      - name: Snapshot the win markets
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          UK_RUNNER: ${{ vars.BETFAIR_RUNNER }}
        run: |
          set -o pipefail
          mkdir -p out
          if [ -z "$UK_RUNNER" ]; then
            echo "Betfair refuses GitHub's own runners (403 at the login): set the repository variable BETFAIR_RUNNER to a self-hosted runner in the UK" | tee out/live_odds.log
            exit 0
          fi
          if [ -z "$BETFAIR_APP_KEY" ]; then
            echo "BETFAIR_APP_KEY is not set: save the delayed application key as that repository secret" | tee out/live_odds.log
            exit 0
          fi
          date -u +"snapshot taken %Y-%m-%dT%H:%M:%SZ" | tee out/live_odds.log
          python betfair_sync.py --live --csv out/live_odds.csv 2>&1 | tee -a out/live_odds.log

      - name: Score the snapshot (the owner's staking)
        if: hashFiles('out/live_odds.csv') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRED_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PRED_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          set -o pipefail
          DAY=$(TZ=Europe/London date +%F)
          python -c "import boto3, os, sys; boto3.client('s3', region_name=os.environ['PRED_REGION']).download_file(os.environ['PRED_BUCKET'], sys.argv[1], sys.argv[2])" \
              "predictions/$DAY.csv" "out/predictions_$DAY.csv"
          python scripts/score_live_prices.py --predictions "out/predictions_$DAY.csv" --live out/live_odds.csv \
              --out out/scored.csv 2>&1 | tee out/scored.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-odds-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
