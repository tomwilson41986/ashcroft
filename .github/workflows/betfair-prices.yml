name: Betfair Historic Prices (backfill)
# Betfair's SP price files (win + place, UK + IRE: morning and pre-play prices and volumes, BSP, in-play range)
# for a range of days, fetched on the owner's UK runner and archived to s3://$CAPTURE_BUCKET/betfair_prices_raw/.
# promo.betfair.com refuses GitHub's own runners (HTTP 403 from Azure US), which is why this runs on the UK server.
# The nightly job daily-results.yml, the one job that writes horse_racing.db, loads every archived file the database
# does not hold yet. The daily fetch is part of live-record.yml; this workflow is for backfills, by hand.
#
# Until 30 Sep 2026 this job also downloaded, changed and re-uploaded the whole database on a 06:15 UTC schedule. It
# only ever failed at the probe (GitHub's runners are refused); once the UK runner was named it would have run
# there before the morning's trading, a second writer of the database beside blandford-sync at 06:45.
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Start date (YYYY-MM-DD). Leave empty for the last 5 days.'
        required: false
        type: string
      date_to:
        description: 'End date (YYYY-MM-DD). Defaults to yesterday.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: betfair-prices-backfill   # its own group: a pending recorder run must not be cancelled by a backfill
  cancel-in-progress: false

jobs:
  archive:
    if: vars.BETFAIR_RUNNER != ''
    runs-on: ${{ vars.BETFAIR_RUNNER }}
    timeout-minutes: 120
    steps:
      - name: Probe Betfair from this runner
        run: |
          set +e
          code=$(curl -sS -o /tmp/listing.html -w '%{http_code}' --max-time 30 \
                 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' \
                 https://promo.betfair.com/betfairsp/prices)
          csvs=$(grep -o -i 'dwbf[a-z]*[0-9]\{8\}\.csv' /tmp/listing.html 2>/dev/null | sort -u | wc -l)
          echo "HTTP $code from promo.betfair.com; $csvs distinct CSV names in the listing"
          if [ "$code" != "200" ]; then echo "::error::promo.betfair.com refused this runner (HTTP $code)"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Python on the UK server
        # the same Python 3.12 environment the trader uses (live-trade.yml)
        run: |
          VENV="$HOME/.venvs/ashcroft"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt

      - name: Fetch the price files and archive them to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
        run: |
          RAW="$HOME/.ashcroft/betfair_raw"
          if [ -n "$DATE_FROM" ]; then
            if ! [[ "$DATE_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date_from must be YYYY-MM-DD"; exit 1; fi
            ARGS=(--from "$DATE_FROM")
            if [ -n "$DATE_TO" ]; then
              if ! [[ "$DATE_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date_to must be YYYY-MM-DD"; exit 1; fi
              ARGS+=(--to "$DATE_TO")
            fi
          else
            ARGS=(--days 5)
          fi
          python betfair_prices.py --fetch "${ARGS[@]}" --dir "$RAW" --push-s3
          echo "files on the server: $(ls "$RAW" | wc -l)"
