name: Betfair price files (horse racing, nightly)
# Every price file Betfair publishes at promo.betfair.com/betfairsp/prices, all markets (the owner's ask, 1 Oct 2026:
# "Pull in all betfair price files daily, for all markets"), archived on the owner's UK runner to
# s3://$CAPTURE_BUCKET/betfair_prices_raw/<name>. promo.betfair.com refuses GitHub's own runners (HTTP 403 from
# Azure US), which is why this runs on the UK server.
#
# Horse racing only (the owner, 3 Nov 2026: nothing but horse racing on the horse runner): the greyhound price files
# are archived from the greyhound runner (greyhound-prices.yml); the tennis odds and Betfair's Historic Data for the
# other sports, which ran here until then, run on the data runner (other-data.yml).
#
# Slowly (the owner's word): one file at a time with a pause between, never in parallel. Each night: the files the
# archive lacks, and the last week again (Betfair rewrites recent files; a file is stored again only when it has
# changed). The last week goes first, then the UK and Irish racing files from 2018 (what the nightly load reads), then
# the other markets from 2018, then every older file, each newest first.
# The run takes no new file after 04:50 UTC, before the morning's trading at 05:15 UTC (from 12 Oct; until then it
# stopped at 06:15, before the 06:50 trading), and the next night takes up the rest:
# Betfair listed 72,443 files on 1 Oct 2026, several nights' work at this pace.
#
# The nightly job daily-results.yml, the one job that writes horse_racing.db, loads the UK and Irish racing files from
# the archive; the other markets stay in S3, raw. Nothing here touches the database.
#
# Until 30 Sep 2026 this job also downloaded, changed and re-uploaded the whole database on a 06:15 UTC schedule. It
# only ever failed at the probe (GitHub's runners are refused); once the UK runner was named it would have run
# there before the morning's trading, a second writer of the database beside blandford-sync at 06:45.
on:
  schedule:
    - cron: '30 22 * * *'    # after the evening settlement (21:45 UTC); no new file after 04:50 UTC
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Only files from this day (YYYY-MM-DD). Leave empty for every day Betfair lists.'
        required: false
        type: string
      date_to:
        description: 'Only files to this day (YYYY-MM-DD).'
        required: false
        type: string
      market:
        description: 'Only these markets, e.g. ukwin,ukplace. Leave empty for every market.'
        required: false
        type: string
      max_minutes:
        description: 'Take no new file after this many minutes (at most: until 04:50 UTC at night, 15 minutes by day).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: betfair-prices-archive   # its own group: a pending recorder run must not be cancelled by this one
  cancel-in-progress: false

jobs:
  archive:
    if: vars.BETFAIR_RUNNER != ''
    runs-on: ${{ vars.BETFAIR_RUNNER }}
    timeout-minutes: 395                 # 22:30 UTC + 6 h 35: stopped by 05:05 UTC whatever happens (the trader at 05:15)
    steps:
      - name: Probe Betfair from this runner
        run: |
          set +e
          # three tries two minutes apart: the host answered 302 on 22, 24 and 25 Oct and 200 on the nights between
          for try in 1 2 3; do
            code=$(curl -sS -o /tmp/listing.html -D /tmp/headers.txt -w '%{http_code}' --max-time 30 \
                   -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' \
                   https://promo.betfair.com/betfairsp/prices)
            csvs=$(grep -o -i 'dwbf[a-z]*[0-9]\{8\}\.csv' /tmp/listing.html 2>/dev/null | sort -u | wc -l)
            echo "try $try: HTTP $code from promo.betfair.com; $csvs distinct CSV names in the listing"
            grep -i '^location:' /tmp/headers.txt || true
            [ "$code" = "200" ] && break
            [ "$try" -lt 3 ] && sleep 120
          done
          if [ "$code" != "200" ]; then echo "::error::promo.betfair.com refused this runner (HTTP $code)"; exit 1; fi

      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}

      - name: Python on the UK server
        if: ${{ !cancelled() }}
        # the same Python 3.12 environment the trader uses (live-trade.yml)
        run: |
          VENV="$HOME/.venvs/ashcroft"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt

      # The owner, 4 Nov 2026 ("when is the best time to bet ... Night before? At 4am?"): no book was kept between the
      # evening record (to about 22:00 UK) and the trader's start (05:17 UTC), so 04:00 could not be measured.
      # Tomorrow's GB/IE win markets, each snapshotted every ten minutes through the night beside the archive, to
      # s3://$CAPTURE_BUCKET/betfair_live/<day>/books_overnight.csv.gz (the timing study, research/arms/timing.py,
      # reads it; the nightly load reads only the day's writers). Read-only, the delayed key, no order API; it stops
      # by 04:52 UTC, before the trader's 05:15, and the step below waits for it so the job ends with it.
      - name: Start the overnight record of tomorrow's win markets (read-only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          now=$(date -u +%s)
          end=$(date -u -d "$(date -u -d "@$now" +%F) 04:52" +%s)
          if [ "$now" -ge "$end" ]; then end=$(( end + 86400 )); fi
          MIN=$(( (end - now) / 60 ))
          if [ "$MIN" -gt 420 ] || [ "$MIN" -lt 15 ]; then echo "not the night ($MIN minutes to 04:52 UTC): no record"; exit 0; fi
          DAY=$(TZ=Europe/London date -d "@$(( now + 21600 ))" +%F)     # the racing day the night leads to
          echo "Recording $DAY's win markets every 10 minutes for $MIN minutes (to 04:52 UTC)"
          setsid nohup python betfair_recorder.py --record --date "$DAY" --tag overnight --market-types WIN \
            --every 600 --every-near 600 --for-minutes "$MIN" > overnight.log 2>&1 < /dev/null &
          echo $! > overnight.pid

      - name: Archive the price files to S3, one file at a time
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          MARKET: ${{ inputs.market }}
          WANT: ${{ inputs.max_minutes }}
        run: |
          ARGS=()
          for v in "$DATE_FROM" "$DATE_TO"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "dates must be YYYY-MM-DD"; exit 1; fi
          done
          if [ -n "$DATE_FROM" ]; then ARGS+=(--from "$DATE_FROM"); fi
          if [ -n "$DATE_TO" ]; then ARGS+=(--to "$DATE_TO"); fi
          if [ -n "$MARKET" ]; then
            if ! [[ "$MARKET" =~ ^[a-z0-9]+(,[a-z0-9]+)*$ ]]; then echo "market must be names like ukwin,ukplace"; exit 1; fi
            ARGS+=(--market "$MARKET")
          fi
          # The runner's other jobs: the trader from 05:15 UTC, the recorder from 10:10 UTC to the last race, the
          # evening settlement at 21:45 UTC. At night the archive takes new files until 04:50 UTC; by day (a dispatch
          # that finds the runner free between jobs) for 15 minutes at most, and never past 21:40 UTC.
          now=$(date -u +%s)
          day=$(date -u -d "@$now" +%F)
          dawn=$(date -u -d "$day 04:50" +%s)
          dusk=$(date -u -d "$day 21:40" +%s)
          if [ "$now" -ge "$dusk" ]; then
            MAX=$(( (dawn + 86400 - now) / 60 ))
          elif [ "$now" -lt "$dawn" ]; then
            MAX=$(( (dawn - now) / 60 ))
          else
            MAX=$(( (dusk - now) / 60 ))
            if [ "$MAX" -gt 15 ]; then MAX=15; fi
          fi
          if [ "$MAX" -gt 450 ]; then MAX=450; fi
          if [ -n "$WANT" ]; then
            if ! [[ "$WANT" =~ ^[0-9]+$ ]]; then echo "max_minutes must be a whole number"; exit 1; fi
            if [ "$WANT" -lt "$MAX" ]; then MAX=$WANT; fi
          fi
          if [ "$MAX" -lt 1 ]; then echo "No time before the runner's next job: the next night takes it up"; exit 0; fi
          echo "Taking new files for up to $MAX minutes"
          # horse racing only on this runner (the owner, 3 Nov 2026): the greyhound files are archived from the
          # greyhound runner (greyhound-prices.yml)
          python betfair_prices.py --archive "${ARGS[@]}" --skip-market-prefix greyhound --max-minutes "$MAX"

      - name: Wait for the overnight record (it stops by 04:52 UTC)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          [ -f overnight.pid ] || { echo "no overnight record tonight"; exit 0; }
          pid=$(cat overnight.pid)
          stop=$(date -u -d "$(date -u +%F) 04:56" +%s)
          [ "$(date -u +%s)" -ge "$stop" ] && [ "$(date -u +%H)" -ge 12 ] && stop=$(( stop + 86400 ))
          while kill -0 "$pid" 2>/dev/null && [ "$(date -u +%s)" -lt "$stop" ]; do sleep 30; done
          if kill -0 "$pid" 2>/dev/null; then echo "still running at 04:56 UTC: stopped"; kill -INT "$pid"; sleep 20; kill -9 "$pid" 2>/dev/null || true; fi
          tail -n 15 overnight.log || true
