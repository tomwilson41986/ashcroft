name: Live trading (the owner's book)

# The owner's rule with real money on the owner's Betfair account (auto_trade.py --live, trading/config_live.json;
# the owner's decision of 30 Sep 2026): every runner whose expected CLV at the best back price is at least +3% under
# the closing model, staked to win GBP400 (the owner, 7 Oct; GBP250 until then), at most GBP300 a bet, each back filled
# at once or not at all and laid at the Betfair SP as soon as it is matched, with what the account has (short of funds
# it holds, and trades again as the races are run and the stakes come back). From 08:00 UK until 15 minutes before each
# off, with no limit on the day's stakes: the owner's decisions of 1 Oct and 7 Oct ("Let's not stop. We should just
# trade if we think the price is right"; a 14:00 stop, ledger stop-1400-1007, was not taken up). The summary scores the
# bets entered by 11:00 UK apart from the later ones.
#
# One runner serves the trading and the market record, so on a trading day this job records the markets itself
# (betfair_recorder.py, read-only, beside the trader; the trader's own books go to their own files), and tomorrow's
# win markets from 17:00 to 21:30 UK (books_evening, the owner's question of 4 Oct on betting the evening before);
# the recorder's 10:10 UTC run waits for the runner and takes the evening's part (yesterday's settled books, the
# price files). A restart never waits behind the recorder: when the owner cancels this run to restart it and the
# recorder takes the runner meanwhile, the recorder sees the new run waiting, stops within a minute or two and queues
# again behind it (scripts/give_way.py, from 7 Oct; that day both restarts waited behind it for 50 minutes).
#
# The owner's switches: the repository variable TRADING_LIVE must be 'yes' for any order to be placed, and
# BETFAIR_RUNNER must name the UK runner (Betfair refuses GitHub's own runners); without it the job is skipped.
# The keys: the secret BETFAIR_LIVE_APP_KEY (the owner's live application key, 6 Oct) goes to the trader's own
# process only; the market records beside it, read-only, keep BETFAIR_APP_KEY (the delayed key), as do all the other
# workflows, because Betfair permits no read-only use of live data.
# To stop at once: cancel the running "Live trading" run (the ledger is written, the lays at SP that hedge the
# backs stay), or create the S3 object trading/STOP (no new bets within a minute). The evening run settles the day
# from the closed markets and emails the result; the morning run emails what it backed.

on:
  schedule:
    - cron: '50 6 * * *'     # trade: the session waits for 08:00 UK and trades to 15 minutes before each off
    - cron: '45 21 * * *'    # settle: after the last race
  workflow_dispatch:
    inputs:
      mode:
        description: 'settle, or trade (only with TRADING_LIVE=yes)'
        type: choice
        options: [settle, trade]
        default: settle
      date:
        description: 'UK racing day, YYYY-MM-DD (default today)'
        required: false
        type: string
      trade_until:
        description: 'trade: last UK time to place bets, HH:MM (blank: the config, to the last race; never within 15 min of an off)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: live-trading
  cancel-in-progress: false

jobs:
  live:
    if: vars.BETFAIR_RUNNER != ''
    runs-on: ${{ vars.BETFAIR_RUNNER }}
    timeout-minutes: 960                 # a trading day runs from 07:50 until the last race, 21:30 at the latest
    steps:
      - name: Choose the session
        id: session
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DAY: ${{ inputs.date }}
          TRADE_UNTIL: ${{ inputs.trade_until }}
          LIVE: ${{ vars.TRADING_LIVE }}
        run: |
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = '45 21 * * *' ]; then MODE=settle; else MODE=trade; fi
            DAY=""
            TRADE_UNTIL=""
          fi
          case "$MODE" in trade|settle) ;; *) echo "mode must be trade or settle"; exit 1 ;; esac
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date must be YYYY-MM-DD"; exit 1; fi
          UNTIL=""
          if [ -n "$TRADE_UNTIL" ]; then
            if ! [[ "$TRADE_UNTIL" =~ ^([01][0-9]|2[0-2]):[0-5][0-9]$ ]]; then echo "trade_until must be HH:MM"; exit 1; fi
            # the session stops five minutes after the last bet may go on
            UNTIL=$(date -u -d "2000-01-01 $TRADE_UNTIL UTC + 5 minutes" +%H:%M)
          fi
          echo "trade_until=$TRADE_UNTIL" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          GO=true
          if [ "$MODE" = trade ] && [ "$LIVE" != yes ]; then
            echo "The owner's switch TRADING_LIVE is not 'yes': no live trading"
            GO=false
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.session.outputs.go == 'true'

      - name: Python on the UK server
        # Python 3.12, the version CI tests, in a virtual environment kept between runs, made by uv (from PyPI):
        # from the server's own 3.12 where it has one (Ubuntu 24.04), else from a 3.12 fetched once (26.04 has 3.14).
        if: steps.session.outputs.go == 'true'
        run: |
          VENV="$HOME/.venvs/ashcroft"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.session.outputs.go == 'true'
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt

      - name: Write the Betfair certificate
        # Optional: certificate login when the secrets exist, otherwise the username and password.
        if: steps.session.outputs.go == 'true'
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            mkdir -p "$HOME/.betfair/certs"
            printf '%s\n' "$BETFAIR_CERT" > "$HOME/.betfair/certs/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$HOME/.betfair/certs/betfair.key"
            chmod 600 "$HOME/.betfair/certs/betfair.key"
            echo "BETFAIR_CERT_FILE=$HOME/.betfair/certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$HOME/.betfair/certs/betfair.key" >> "$GITHUB_ENV"
          fi

      - name: Trade or settle
        if: steps.session.outputs.go == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          # the owner's live application key (6 Oct): the trader's own process only, the one that bets; every
          # read-only process (the market records beside it) keeps the delayed key above, as Betfair requires
          # (no read-only use of live data). Without this secret the trader reads the delayed key's feed.
          BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          TRADING_LIVE: ${{ vars.TRADING_LIVE }}
          # the greyhound model's own switch (greyhound/live.py): real orders only when 'yes'
          GREYHOUND_LIVE: ${{ vars.GREYHOUND_LIVE }}
          # the football model's own switch (football/live.py): real orders only when 'yes'; paper otherwise
          FOOTBALL_LIVE: ${{ vars.FOOTBALL_LIVE }}
          # every book the session reads, kept for research (betfair_recorder.py; never in the way of trading)
          BETFAIR_RECORD: '1'
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          MODE: ${{ steps.session.outputs.mode }}
          DAY: ${{ steps.session.outputs.day }}
          TRADE_UNTIL: ${{ steps.session.outputs.trade_until }}
          UNTIL: ${{ steps.session.outputs.until }}
        run: |
          ARGS=(--live)
          if [ -n "$DAY" ]; then ARGS+=(--date "$DAY"); fi
          # the trader alone runs on the live key when there is one (its value is never printed)
          TRADER_KEY="${BETFAIR_LIVE_APP_KEY:-$BETFAIR_APP_KEY}"
          if [ -n "$BETFAIR_LIVE_APP_KEY" ]; then echo "The trader reads the live key's feed"
          else echo "The trader reads the delayed key's feed (no BETFAIR_LIVE_APP_KEY secret)"; fi
          if [ "$MODE" = settle ]; then
            BETFAIR_APP_KEY="$TRADER_KEY" python auto_trade.py "${ARGS[@]}" --settle
          else
            if [ -z "$TRADE_UNTIL" ]; then                      # the config's window
              TRADE_UNTIL=$(python -c "import json; print(json.load(open('trading/config_live.json'))['trade_until'])")
              UNTIL=$(date -u -d "2000-01-01 $TRADE_UNTIL UTC + 5 minutes" +%H:%M)
            fi
            # the day's market record (read-only) beside the trader: one runner serves both
            python betfair_recorder.py --record --final --until 21:30 > "$RUNNER_TEMP/recorder.log" 2>&1 &
            REC=$!
            # beside it, two records of their own (the owner's ask of 3 Oct; read-only, the nightly load reads
            # neither): the 2/3/4 TBP and each-way markets, and the GB/IE greyhound win and place markets
            python betfair_recorder.py --record --final --until 21:30 --market-types OTHER_PLACE,EACH_WAY \
              --tag other_place > "$RUNNER_TEMP/other_place.log" 2>&1 &
            OTHER=$!
            python betfair_recorder.py --record --final --until 21:30 --event-type 4339 --tag greyhound \
              --market-types WIN,PLACE > "$RUNNER_TEMP/greyhound.log" 2>&1 &
            DOGS=$!
            # the greyhound model (greyhound/live.py, greyhound/live_config.json; the owner's ask of 6 Oct): each GB
            # greyhound runner backed once, at its first real price (back and lay within 25%) after the morning's
            # prices are in, where the edge clears 0.2: GBP5 level, held, no price over 20, no race limit, no daily
            # cap (from 7 Oct). Real orders only with GREYHOUND_LIVE=yes; S3 greyhound/STOP or trading/STOP stops new
            # bets. Ledger: s3://$CAPTURE_BUCKET/sources/greyhound/live/<mode>/<day>/
            GHLIVE=()
            if [ "$GREYHOUND_LIVE" = yes ]; then GHLIVE=(--live); fi
            # a trader too: it reads the live key's feed (a fill-or-kill back on a delayed price is missed)
            BETFAIR_APP_KEY="$TRADER_KEY" python -m greyhound.live --trade "${GHLIVE[@]}" --until 21:30 \
              > "$RUNNER_TEMP/greyhound_trader.log" 2>&1 &
            GHT=$!
            # the football model (football/live.py, football/live_config.json; reports/football_model.md): Betfair's
            # MATCH_ODDS and OVER_UNDER_25 markets in scope, each selection decided once in the 6 hours before kick-off,
            # backed where the pooled chance's expected return clears the edge: GBP2 level, capped a match and a day.
            # Paper unless FOOTBALL_LIVE=yes; on paper it is read-only, so it keeps the delayed key. S3 football/STOP or
            # trading/STOP stops new bets. Ledger: s3://$CAPTURE_BUCKET/sources/football/live/<mode>/<day>/
            FBLIVE=()
            FBKEY="$BETFAIR_APP_KEY"
            if [ "$FOOTBALL_LIVE" = yes ]; then FBLIVE=(--live); FBKEY="$TRADER_KEY"; fi
            BETFAIR_APP_KEY="$FBKEY" timeout 15h python -m football.live --trade "${FBLIVE[@]}" --until 21:30 \
              > "$RUNNER_TEMP/football_trader.log" 2>&1 &
            FBT=$!
            # and the Tote's pools (the owner's ask of 6 Oct; read-only, no login, tote_recorder.py): each GB/IE
            # race's win and place dividends near the off, every pool's total, the declared dividends
            timeout 14h python tote_recorder.py --record --until 21:30 > "$RUNNER_TEMP/tote.log" 2>&1 &
            TOTE=$!
            # tomorrow's win markets the evening before, 17:00-21:30 UK (read-only, to their own files; the owner's
            # question of 4 Oct: would the rule's backs close better taken at 7pm the evening before?)
            TOMORROW=$(date -d "${DAY:-$(TZ=Europe/London date +%F)} + 1 day" +%F) || TOMORROW=""
            EVE=""
            if [ -n "$TOMORROW" ]; then
              python betfair_recorder.py --record --date "$TOMORROW" --tag evening --market-types WIN --every 900 \
                --evening 17:00-21:30 > "$RUNNER_TEMP/evening.log" 2>&1 &
              EVE=$!
            fi
            set +e
            BETFAIR_APP_KEY="$TRADER_KEY" python auto_trade.py "${ARGS[@]}" --trade-until "$TRADE_UNTIL" --until "$UNTIL"
            CODE=$?
            wait "$REC"
            echo "recorder exited $?"
            tail -n 30 "$RUNNER_TEMP/recorder.log"
            wait "$OTHER"; echo "other place record exited $?"
            wait "$DOGS"; echo "greyhound record exited $?"
            wait "$GHT"; echo "greyhound trader exited $?"
            tail -n 20 "$RUNNER_TEMP/greyhound_trader.log"
            wait "$FBT"; echo "football trader exited $?"
            tail -n 20 "$RUNNER_TEMP/football_trader.log"
            wait "$TOTE"; echo "Tote record exited $?"
            tail -n 5 "$RUNNER_TEMP/other_place.log" "$RUNNER_TEMP/greyhound.log" "$RUNNER_TEMP/tote.log"
            if [ -n "$EVE" ]; then
              wait "$EVE"
              echo "evening recorder exited $?"
              tail -n 5 "$RUNNER_TEMP/evening.log"
            fi
            exit $CODE
          fi

      - name: Keep the ledger
        if: always() && steps.session.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-trading-${{ steps.session.outputs.mode }}-${{ github.run_id }}
          path: out/trading/
          if-no-files-found: ignore
          retention-days: 90
