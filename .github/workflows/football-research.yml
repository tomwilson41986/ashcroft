name: Football research (read-only, S3)

# Football research that needs the S3 store (the sources, the gold tables, the live feed's record), run by hand on
# GitHub's runners and printed to the run's summary and artifact. Read-only (nothing is written to S3) but for the
# warehouse job, which writes the football data warehouse's own tables under sources/football/warehouse/. Nothing
# reaches Betfair. Each job is one research module, chosen from the list.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'research job'
        required: true
        type: choice
        options:
          - cross_league_data
          - cross_league_check
          - cross_league_price
          - price_discovery
          - cross_market
          - feed_coverage
          - cup_form_check
          - paper_lines_scan
          - lineup_late_move
          - lineup_release
          - close_model_books
          - feature_report
          - review_arms
          - feature_batch
          - tactics_batch
          - sportmonks_batch
          - fd_lines_batch
          - sm_pred_batch
          - eu_form_batch
          - bf_lab_join
          - sm_feat2_batch
          - bf_features2
          - bf_tune
          - buchdahl
          - bf_lab_stack
          - win_prob
          - strategy_100
          - b2l_paper
          - historic_probe
          - b2l_live_model
          - warehouse
          - warehouse_models
      days:
        description: 'days of the live record to read'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: football-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
      CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
      CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r football/warehouse/requirements.txt
      - name: Cup and European data, and the live record of them
        if: inputs.job == 'cross_league_data'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_cross_league_data --days "$DAYS" --out out/cross_league_data.json
      - name: Cross-league strength on cup and continental results
        if: inputs.job == 'cross_league_check'
        run: python -m research.open_close.football_cross_league_check --out out/cross_league_check.json
      - name: Cross-league strength against Betfair's prices (closing price and winning the bet)
        if: inputs.job == 'cross_league_price'
        run: python -m research.open_close.football_cross_league_price --out out/cross_league_price.json
      - name: Price discovery and the rule scan (Betfair's own prices, model-free)
        if: inputs.job == 'price_discovery'
        run: python -m research.open_close.football_price_discovery --out out/price_discovery.json
      - name: Cross-market consistency and who moves (Betfair's own prices, model-free)
        if: inputs.job == 'cross_market'
        run: python -m research.open_close.football_cross_market --out out/cross_market.json
      - name: API-Football's coverage of our Betfair matches (about 25 API requests of the 7,500 a day)
        if: inputs.job == 'feed_coverage'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_feed_coverage --days "$DAYS" --out out/feed_coverage.json
      - name: Cup and European ties with each club's form from the feed (closing price and winning the bet)
        if: inputs.job == 'cup_form_check'
        run: python -m research.open_close.football_cup_form_check --out out/cup_form_check.json
      - name: Every strategy the paper book scores at the recorded books (crossing, resting, both targets)
        if: inputs.job == 'paper_lines_scan'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_paper_lines_scan --days "$DAYS" --out out/paper_lines_scan.json
      - name: Line-up news and Betfair's late move (the closing-line model's team-news input)
        if: inputs.job == 'lineup_late_move'
        run: python -m research.open_close.football_lineup_late_move --out out/lineup_late_move.json
      - name: Line-up release at the recorded books (the move from the elevens' release, at real spreads)
        if: inputs.job == 'lineup_release'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_lineup_release --days "$DAYS" --out out/lineup_release.json
      - name: The closing-line model on the recorded books, and the spread-aware gate
        if: inputs.job == 'close_model_books'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_close_model_books --days "$DAYS" --out out/close_model_books.json
      # the lab-matrix jobs: the inputs and the cache as football-trials.yml builds them (read-only copies)
      - name: Lab inputs (gold, silver and API-Football history)
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms' || inputs.job == 'feature_batch' || inputs.job == 'tactics_batch' || inputs.job == 'sportmonks_batch' || inputs.job == 'fd_lines_batch' || inputs.job == 'sm_pred_batch' || inputs.job == 'eu_form_batch' || inputs.job == 'bf_lab_join' || inputs.job == 'sm_feat2_batch' || inputs.job == 'buchdahl' || inputs.job == 'bf_lab_stack'
        run: |
          mkdir -p src/football src/api_football
          aws s3 sync "s3://$CAPTURE_BUCKET/sources/football/gold/" src/football/gold/ --only-show-errors
          aws s3 cp "s3://$CAPTURE_BUCKET/sources/football/matches.parquet" src/football/matches.parquet --only-show-errors
          for x in matches players events stats; do
            aws s3 cp "s3://$CAPTURE_BUCKET/sources/api_football/history_$x.parquet" "src/api_football/history_$x.parquet" --only-show-errors
          done
          # the Sportmonks table, where it has been built (sources/sportmonks.py)
          mkdir -p src/sportmonks
          aws s3 cp "s3://$CAPTURE_BUCKET/sources/sportmonks/matches.parquet" src/sportmonks/matches.parquet --only-show-errors || echo "no Sportmonks table yet"
      - name: Restore the lab cache
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms' || inputs.job == 'feature_batch' || inputs.job == 'tactics_batch' || inputs.job == 'sportmonks_batch' || inputs.job == 'fd_lines_batch' || inputs.job == 'sm_pred_batch' || inputs.job == 'eu_form_batch' || inputs.job == 'bf_lab_join' || inputs.job == 'sm_feat2_batch' || inputs.job == 'buchdahl' || inputs.job == 'bf_lab_stack'
        uses: actions/cache@v4
        with:
          path: .football_cache
          key: football-lab-${{ hashFiles('football/**') }}-${{ github.run_id }}
          restore-keys: |
            football-lab-${{ hashFiles('football/**') }}-
            football-lab-
      - name: The lab matrix (stages rebuilt only when their code or inputs change)
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms' || inputs.job == 'feature_batch' || inputs.job == 'tactics_batch' || inputs.job == 'sportmonks_batch' || inputs.job == 'fd_lines_batch' || inputs.job == 'sm_pred_batch' || inputs.job == 'eu_form_batch' || inputs.job == 'bf_lab_join' || inputs.job == 'sm_feat2_batch' || inputs.job == 'buchdahl' || inputs.job == 'bf_lab_stack'
        run: timeout 4200 python -m football.lab cache --root src --history-root src --cache .football_cache
      - name: Feature report (importance on Betfair's moves, leave a family out, the target's checks)
        if: inputs.job == 'feature_report'
        run: python -m research.open_close.football_feature_report --cache .football_cache --out-json out/football_feature_report.json
      - name: Feature batch of 24 Nov (eight new blocks against the best model so far; football-feature-batch-1124)
        if: inputs.job == 'feature_batch'
        run: python -m research.open_close.football_feature_batch --cache .football_cache --out-json out/football_feature_batch.json
      - name: Tactics batch (formation matchups and the match simulator; football-tactics-batch-1124)
        if: inputs.job == 'tactics_batch'
        run: python -m research.open_close.football_feature_batch --batch tactics --cache .football_cache --out-json out/football_tactics_batch.json
      - name: Sportmonks xG batch (football-sportmonks-xg-1124; fitted on 2024/25, tested on 2025/26)
        if: inputs.job == 'sportmonks_batch'
        run: python -m research.open_close.football_feature_batch --batch sportmonks --cache .football_cache --out-json out/football_sportmonks_batch.json
      - name: football-data lines batch (Betfair handicap and goals prices, line moves, book counts; football-fd-lines-1124)
        if: inputs.job == 'fd_lines_batch'
        run: python -m research.open_close.football_feature_batch --batch fd_lines --cache .football_cache --out-json out/football_fd_lines_batch.json
      - name: Sportmonks predictions batch (football-sportmonks-pred-1124; fitted on 2024/25, tested on 2025/26)
        if: inputs.job == 'sm_pred_batch'
        run: python -m research.open_close.football_feature_batch --batch sm_pred --cache .football_cache --out-json out/football_sm_pred_batch.json
      - name: European form batch (football-eu-form-1124; fitted on 2024/25, tested on 2025/26)
        if: inputs.job == 'eu_form_batch'
        run: python -m research.open_close.football_feature_batch --batch eu_form --cache .football_cache --out-json out/football_eu_form_batch.json
      - name: The Betfair-native closing-price model with the lab's features (football-bf-lab-join-1124)
        if: inputs.job == 'bf_lab_join'
        run: python -m research.open_close.football_bf_lab_join --cache .football_cache --out-json out/bf_lab_join.json
      - name: Sportmonks feature batch 2 (opponent-adjusted xG, finishing and luck, more statistics; football-sm-feat2-1124)
        if: inputs.job == 'sm_feat2_batch'
        run: python -m research.open_close.football_feature_batch --batch sm_feat2 --cache .football_cache --out-json out/football_sm_feat2_batch.json
      - name: Review arms (each repair and new block against the base, paired by match day)
        if: inputs.job == 'review_arms'
        run: python -m research.open_close.football_review_arms --cache .football_cache --out-json out/football_review_arms.json
      # the football data warehouse (docs/football_data_platform.md; football-warehouse.yml is its own workflow once
      # merged: a new workflow file cannot be dispatched from a branch). S3 only; nothing reaches Betfair.
      - name: Betfair Historic Data API probe (the login, what the account holds, yesterday's soccer file count)
        if: inputs.job == 'historic_probe'
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: |
          mkdir -p out
          python -m football.warehouse historic --probe | tee out/historic_probe.json
      - name: Football data warehouse (ingest the listed bundles, build silver and gold, link, check)
        if: inputs.job == 'warehouse'
        shell: bash                  # -eo pipefail: a command that fails behind "| tee" fails the step
        env:
          FOOTBALL_BUNDLE_URLS: ${{ secrets.FOOTBALL_BUNDLE_URLS }}    # {"<bundle name>": "<link>"}; never printed
        run: |
          mkdir -p out
          python -m football.warehouse ingest-queue | tee out/warehouse_ingest.json
          python -m football.warehouse build | tee out/warehouse_build.json
          python -m football.warehouse.link run | tee out/warehouse_link.json || echo "link stage failed (reported, not fatal)"
          python -m football.warehouse check --markdown out/warehouse_quality.md > out/warehouse_quality.json
          python -m football.warehouse facts --out out/warehouse_facts.json > /dev/null || echo "facts failed (reported)"
      - name: Closing-price efficiency and the Betfair-native closing-price model, on the warehouse
        if: inputs.job == 'warehouse' || inputs.job == 'warehouse_models'
        continue-on-error: true
        run: |
          mkdir -p out
          python -m research.open_close.football_bf_efficiency --out-json out/bf_efficiency.json > /dev/null
          python -m research.open_close.football_bf_close_model --out-json out/bf_close_model.json > /dev/null
          python -m research.open_close.football_trade_model --out-json out/football_trade_model.json > /dev/null
      - name: More Betfair price-file features for the Betfair-native model (football-bf-features2-1124)
        if: inputs.job == 'bf_features2'
        run: |
          mkdir -p out
          python -m research.open_close.football_bf_features2 --out-json out/bf_features2.json
      - name: The Betfair-native model tuned inside the walk-forward (football-bf-tune-1124)
        if: inputs.job == 'bf_tune'
        run: |
          mkdir -p out
          python -m research.open_close.football_bf_tune --out-json out/bf_tune.json
      - name: Buchdahl's tests (margin removal, move retention, football-data's xG; football-buchdahl-1124)
        if: inputs.job == 'buchdahl'
        run: |
          mkdir -p out
          python -m research.open_close.football_buchdahl --src src --cache .football_cache --out-json out/buchdahl.json
      - name: The Betfair-native model with the lab's forecast as one feature (football-bf-lab-stack-1124)
        if: inputs.job == 'bf_lab_stack'
        run: python -m research.open_close.football_bf_lab_join --stack --cache .football_cache --out-json out/bf_lab_stack.json
      - name: The most accurate win probability, scored on results (football-win-prob-1124)
        if: inputs.job == 'win_prob'
        run: |
          mkdir -p out
          python -m research.open_close.football_win_prob --out-json out/win_prob.json
      - name: Up to 100 trading strategies on Betfair's prices and the results (football-strategy-100-1124)
        if: inputs.job == 'strategy_100'
        run: |
          mkdir -p out
          python -m research.open_close.football_strategy_100 --out-json out/strategy_100.json
      - name: The back-to-lay paper test at the recorded quotes (football-b2l-paper-1124)
        if: inputs.job == 'b2l_paper'
        run: |
          mkdir -p out
          python -m research.open_close.football_b2l_paper --out-json out/b2l_paper.json
      - name: The back-to-lay strategy re-scored with a model that reads only what the live feed sees (football-b2l-live-model-1125)
        if: inputs.job == 'b2l_live_model'
        run: |
          mkdir -p out
          python -m research.open_close.football_b2l_live_model --out-json out/b2l_live_model.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for f in out/*.md; do
            [ -f "$f" ] || continue
            { echo "## $(basename "$f")"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in out/*.json; do
            [ -f "$f" ] || continue
            { echo "## $(basename "$f")"; echo '```'; head -c 60000 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: football-research
          path: out/
          if-no-files-found: ignore
