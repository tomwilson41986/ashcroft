name: Football research (read-only, S3)

# Football research that needs the S3 store (the sources, the gold tables, the live feed's record), run by hand on
# GitHub's runners and printed to the run's summary and artifact. Read-only (nothing is written to S3) but for the
# warehouse job, which writes the football data warehouse's own tables under sources/football/warehouse/. Nothing
# reaches Betfair. Each job is one research module, chosen from the list.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'research job'
        required: true
        type: choice
        options:
          - cross_league_data
          - cross_league_check
          - cross_league_price
          - price_discovery
          - cross_market
          - feed_coverage
          - cup_form_check
          - paper_lines_scan
          - lineup_late_move
          - lineup_release
          - close_model_books
          - feature_report
          - review_arms
          - warehouse
          - warehouse_models
      days:
        description: 'days of the live record to read'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: football-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
      CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
      CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r football/warehouse/requirements.txt
      - name: Cup and European data, and the live record of them
        if: inputs.job == 'cross_league_data'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_cross_league_data --days "$DAYS" --out out/cross_league_data.json
      - name: Cross-league strength on cup and continental results
        if: inputs.job == 'cross_league_check'
        run: python -m research.open_close.football_cross_league_check --out out/cross_league_check.json
      - name: Cross-league strength against Betfair's prices (closing price and winning the bet)
        if: inputs.job == 'cross_league_price'
        run: python -m research.open_close.football_cross_league_price --out out/cross_league_price.json
      - name: Price discovery and the rule scan (Betfair's own prices, model-free)
        if: inputs.job == 'price_discovery'
        run: python -m research.open_close.football_price_discovery --out out/price_discovery.json
      - name: Cross-market consistency and who moves (Betfair's own prices, model-free)
        if: inputs.job == 'cross_market'
        run: python -m research.open_close.football_cross_market --out out/cross_market.json
      - name: API-Football's coverage of our Betfair matches (about 25 API requests of the 7,500 a day)
        if: inputs.job == 'feed_coverage'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_feed_coverage --days "$DAYS" --out out/feed_coverage.json
      - name: Cup and European ties with each club's form from the feed (closing price and winning the bet)
        if: inputs.job == 'cup_form_check'
        run: python -m research.open_close.football_cup_form_check --out out/cup_form_check.json
      - name: Every strategy the paper book scores at the recorded books (crossing, resting, both targets)
        if: inputs.job == 'paper_lines_scan'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_paper_lines_scan --days "$DAYS" --out out/paper_lines_scan.json
      - name: Line-up news and Betfair's late move (the closing-line model's team-news input)
        if: inputs.job == 'lineup_late_move'
        run: python -m research.open_close.football_lineup_late_move --out out/lineup_late_move.json
      - name: Line-up release at the recorded books (the move from the elevens' release, at real spreads)
        if: inputs.job == 'lineup_release'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_lineup_release --days "$DAYS" --out out/lineup_release.json
      - name: The closing-line model on the recorded books, and the spread-aware gate
        if: inputs.job == 'close_model_books'
        env:
          DAYS: ${{ inputs.days }}
        run: python -m research.open_close.football_close_model_books --days "$DAYS" --out out/close_model_books.json
      # the lab-matrix jobs: the inputs and the cache as football-trials.yml builds them (read-only copies)
      - name: Lab inputs (gold, silver and API-Football history)
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms'
        run: |
          mkdir -p src/football src/api_football
          aws s3 sync "s3://$CAPTURE_BUCKET/sources/football/gold/" src/football/gold/ --only-show-errors
          aws s3 cp "s3://$CAPTURE_BUCKET/sources/football/matches.parquet" src/football/matches.parquet --only-show-errors
          for x in matches players events stats; do
            aws s3 cp "s3://$CAPTURE_BUCKET/sources/api_football/history_$x.parquet" "src/api_football/history_$x.parquet" --only-show-errors
          done
      - name: Restore the lab cache
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms'
        uses: actions/cache@v4
        with:
          path: .football_cache
          key: football-lab-${{ hashFiles('football/**') }}-${{ github.run_id }}
          restore-keys: |
            football-lab-${{ hashFiles('football/**') }}-
            football-lab-
      - name: The lab matrix (stages rebuilt only when their code or inputs change)
        if: inputs.job == 'feature_report' || inputs.job == 'review_arms'
        run: timeout 4200 python -m football.lab cache --root src --history-root src --cache .football_cache
      - name: Feature report (importance on Betfair's moves, leave a family out, the target's checks)
        if: inputs.job == 'feature_report'
        run: python -m research.open_close.football_feature_report --cache .football_cache --out-json out/football_feature_report.json
      - name: Review arms (each repair and new block against the base, paired by match day)
        if: inputs.job == 'review_arms'
        run: python -m research.open_close.football_review_arms --cache .football_cache --out-json out/football_review_arms.json
      # the football data warehouse (docs/football_data_platform.md; football-warehouse.yml is its own workflow once
      # merged: a new workflow file cannot be dispatched from a branch). S3 only; nothing reaches Betfair.
      - name: Football data warehouse (ingest the listed bundles, build silver and gold, link, check)
        if: inputs.job == 'warehouse'
        shell: bash                  # -eo pipefail: a command that fails behind "| tee" fails the step
        env:
          FOOTBALL_BUNDLE_URLS: ${{ secrets.FOOTBALL_BUNDLE_URLS }}    # {"<bundle name>": "<link>"}; never printed
        run: |
          mkdir -p out
          python -m football.warehouse ingest-queue | tee out/warehouse_ingest.json
          python -m football.warehouse build | tee out/warehouse_build.json
          python -m football.warehouse.link run | tee out/warehouse_link.json || echo "link stage failed (reported, not fatal)"
          python -m football.warehouse check --markdown out/warehouse_quality.md > out/warehouse_quality.json
          python -m football.warehouse facts --out out/warehouse_facts.json > /dev/null || echo "facts failed (reported)"
      - name: Closing-price efficiency and the Betfair-native closing-price model, on the warehouse
        if: inputs.job == 'warehouse' || inputs.job == 'warehouse_models'
        continue-on-error: true
        run: |
          mkdir -p out
          python -m research.open_close.football_bf_efficiency --out-json out/bf_efficiency.json > /dev/null
          python -m research.open_close.football_bf_close_model --out-json out/bf_close_model.json > /dev/null
          python -m research.open_close.football_trade_model --out-json out/football_trade_model.json > /dev/null
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for f in out/*.md; do
            [ -f "$f" ] || continue
            { echo "## $(basename "$f")"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in out/*.json; do
            [ -f "$f" ] || continue
            { echo "## $(basename "$f")"; echo '```'; head -c 60000 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: football-research
          path: out/
          if-no-files-found: ignore
