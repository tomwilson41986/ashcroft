name: Greyhound stream lab (read-only)

# The stream strategy lab (research/greyhound/stream_lab.py; the owner, 5 Nov 2026: "Our goal is to build a profitable
# strategy, i dont care which one it is"): each night after racing, the day's recorded Exchange Stream
# (greyhound/stream_record.py) read at fixed checkpoints, every rule registered on 5 Nov scored at the price on offer
# and closed at the SP, the days pooled. Read-only: no Betfair login, no order; S3 reads and the lab's own writes.

on:
  schedule:
    - cron: '35 22 * * *'      # after the recorder's last upload (21:30 UK)
  workflow_dispatch:
    inputs:
      day:
        description: "the day to score (YYYY-MM-DD; default: today, UTC)"
        required: false

permissions:
  contents: read

concurrency:
  group: greyhound-stream-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score the day and pool the days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ] && ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "day must be YYYY-MM-DD"; exit 1; fi
          python -m research.greyhound.stream_lab --day "${DAY:-$(date -u +%F)}" --out out/stream_lab
          cat out/stream_lab/report.md >> "$GITHUB_STEP_SUMMARY"
