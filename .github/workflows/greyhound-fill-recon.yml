name: Greyhound early lay, live fills against the replay (read-only)

# The registered diagnostic greyhound-fill-recon-1114 (research/greyhound/fill_recon.py; the owner, 14 Nov 2026: "may
# I build the live-against-replay fill reconciliation - yes"): each live early-lay order replayed exactly through every
# fill model the recorded books allow, against what the live market gave it. Reads the live ledgers, Betfair's settled
# record, the recorded books and the stream from S3; holds no Betfair key: nothing reaches Betfair, no order is placed.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'first day, YYYY-MM-DD (default 2026-11-03, the first live day)'
        required: false
        type: string
      date_to:
        description: 'last day, YYYY-MM-DD (default yesterday, UTC)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: greyhound-fill-recon
  cancel-in-progress: true

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Free disk space
        # GitHub's ubuntu-26.04 runners keep /mnt on the root disk (greyhound-min-lay-price.yml): unused tool caches go first
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1; free -g | sed -n 2,3p
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: The reconciliation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          FROM: ${{ inputs.date_from }}
          TO: ${{ inputs.date_to }}
        run: |
          mkdir -p out
          ARGS=(--out out/fill_recon)
          for v in "$FROM" "$TO"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "dates must be YYYY-MM-DD"; exit 1; fi
          done
          if [ -n "$FROM" ]; then ARGS+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then ARGS+=(--to "$TO"); fi
          python -m research.greyhound.fill_recon "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/fill_recon.md ] && head -c 60000 out/fill_recon.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-fill-recon-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
