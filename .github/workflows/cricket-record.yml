name: Cricket - Betfair market recorder (read-only, delayed key)

# The racing² cricket trader (reports/cricket/README.md; build spec 5.3; the owner, 6 Nov 2026: "start recording all
# transactions in cricket markets"). Every cricket market of every type (--market-types ALL), in play every 5 s,
# read-only through cricket/market/betfair_read.py (a whitelist of read methods: no order can be sent) on the DELAYED
# application key. Each read keeps the book (three levels a side with sizes), the last traded price, the traded
# ladder and the money matched as the delayed key reports them, the market's betDelay and status; once a run, the
# census of every cricket market type. Books to s3://$CAPTURE_BUCKET/sources/cricket/books/<UTC day>/.
#
# Betfair refuses US hosts, so this runs on the UK data runner (vars.DATA_RUNNER, default 'data'), never the horse
# racing runner (CLAUDE.md Rules; tests/test_cricket_guards.py). It hands the runner back by 22:15 UTC for the
# nightly other-data.yml job (22:30) and starts again at 00:45: 22:15-00:45 UTC is not recorded.

on:
  schedule:
    - cron: '45 0 * * *'
  push:
    branches: ['claude/sharp-mayer-*']
    paths:
      - '.github/workflows/cricket-record.yml'
  workflow_dispatch:
    inputs:
      until:
        description: 'stop at this UTC time today (HH:MM)'
        required: false
        type: string
        default: '22:15'
      market_types:
        description: 'market type codes, comma-separated, or ALL'
        required: false
        type: string
        default: 'ALL'

permissions:
  contents: read

concurrency:
  group: cricket-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ${{ vars.DATA_RUNNER || 'data' }}
    timeout-minutes: 1350
    steps:
      - name: Not on the horse racing runner
        env:
          RUNNER_LABEL: ${{ vars.DATA_RUNNER || 'data' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "DATA_RUNNER is the horse racing runner ($LIVE_RUNNER_LABEL): nothing but horse racing runs there"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (the data runner's own environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-data"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-data"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          UNTIL: ${{ inputs.until || '22:15' }}
          TYPES: ${{ inputs.market_types || 'ALL' }}
        run: python -m cricket.market.recorder --market-types "$TYPES" --until "$UNTIL" --inplay-seconds 5
