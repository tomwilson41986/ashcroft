name: Betfair racing census

# Every country Betfair lists horse racing in, its win markets, venues and the money matched on them so far
# (betfair_recorder.py --census-racing; read-only, the delayed key). The owner's ask of 1 Nov 2026: whether Hong Kong,
# Japan and the rest trade on Betfair at all before we build their form data (reports/international_racing_parse.md).
# Read three times a day so each region is read while it races: 05:30 UTC (Japan, Hong Kong, Australia), 12:30
# (Europe, South Africa), 21:30 (the Americas). Saved as betfair_live/<day>/census_racing_<HHMM>.json in S3.

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
  push:
    # one reading from this branch before merge (a workflow only on a branch cannot be dispatched): the week ahead
    branches: ['claude/kind-hamilton-*']
    paths: ['.github/workflows/betfair-racing-census.yml']

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Betfair certificate (if held)
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            mkdir -p "$HOME/.betfair/certs"
            printf '%s\n' "$BETFAIR_CERT" > "$HOME/.betfair/certs/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$HOME/.betfair/certs/betfair.key"
            chmod 600 "$HOME/.betfair/certs/betfair.key"
            echo "BETFAIR_CERT_FILE=$HOME/.betfair/certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$HOME/.betfair/certs/betfair.key" >> "$GITHUB_ENV"
          fi
      - name: Census of racing by country (read-only)
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          HOURS=24
          if [ "${{ github.event_name }}" = "push" ]; then HOURS=168; fi
          timeout 600 python betfair_recorder.py --census-racing --census-hours "$HOURS" | tee census_racing.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat census_racing.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
