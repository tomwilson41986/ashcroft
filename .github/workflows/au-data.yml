name: Australian model data

# The Australian thoroughbred model's data (au/README.md, stage 1; the owner, 2 Nov 2026). Builds the BSP targets
# (every Australian thoroughbred runner's Betfair SP and result from Sep 2012) from our price-file archive in S3 and
# reconciles them with Betfair's public ANZ files; writes s3://$CAPTURE_BUCKET/sources/au/. Read-only on Betfair (no
# key, no login), nothing in horse_racing.db or the live UK/IE jobs; GitHub's own runner (S3 and a public site only).

on:
  workflow_dispatch:
  push:
    branches: ['claude/bold-cori-*']
    paths:
      - 'au/data.py'
      - 'au/config.py'
      - '.github/workflows/au-data.yml'

permissions:
  contents: read

concurrency:
  group: au-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests/test_au_data.py
      - name: Build the BSP targets and reconcile with the ANZ files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          set -o pipefail
          python -m au.data --build --anz-check | tee au_targets_report.json
      - name: Summary
        if: always()
        run: |
          [ -f au_targets_report.json ] && { echo '## au_targets_report.json'; echo '```'; cat au_targets_report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
