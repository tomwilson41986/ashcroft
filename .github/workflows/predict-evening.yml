name: Predictions the night before (tomorrow's card, its own S3 key)
# The owner, 4 Nov 2026: "Run predictions by night before so we are ready to act then if needed". HRB serves no full
# card for tomorrow in the evening (hrb-card-probe.yml, 4-5 Nov): its 48-hour declarations page turns to the day after
# tomorrow during the day (5 Nov's card at 07:28 UTC on 4 Nov, 6 Nov's by 19:08), and the one-day card page holds
# today's card until UK midnight, turning over between 23:10 and 00:45 UTC (00:00 UK). So the night-before run is at
# 00:10 UK, on the one-day card as it stands then: the complete card, priced by the same model and the same code as
# the morning's, to s3://$BUCKET/predictions_evening/<day>.csv with the card kept in racecards_evening/ (the 21:50 UTC
# run of 4 Nov found 6 Nov's declarations and wrote nothing). The morning's run (predict.yml, 04:00 UTC) and its
# predictions/<day>.csv, the file the trader reads, are untouched: the trader does not read this file. What it is for:
# a session before 05:15, if the timing study (research/arms/timing.py) says the overnight prices are worth it, and a
# check of how far the prices move between 00:10 and the morning.
on:
  schedule:
    - cron: '10 0 * * *'     # 00:10 UK in GMT
    - cron: '10 23 * * *'    # 00:10 UK in BST
  workflow_dispatch:
    inputs:
      date:
        description: 'The racing day (YYYY-MM-DD); default: today in the UK'
        required: false
        type: string

concurrency:
  group: predict-evening
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  when:
    # each schedule fires all year; only the one at 00:10 UK runs (the other is an hour off)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.uk.outputs.go }}
    steps:
      - id: uk
        env:
          EVENT: ${{ github.event_name }}
        run: |
          H=$(TZ=Europe/London date +%H)
          if [ "$EVENT" != schedule ] || [ "$H" = 00 ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "UK hour $H: not 00:10 UK, nothing to do"; fi

  predict-evening:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The job makes live Betfair calls and the client sets no socket timeout,
    # so bound the whole thing rather than let a hung connection sit until
    # GitHub's six-hour default. The predictions CSV is written before the
    # price snapshot, so a kill here costs the prices and not the card.
    # 60, not 45: the served models build their features on the history from 2018
    # (1.05m rows), which with swap priced a card in 23-26 minutes on a dry run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[pipeline]" && pip install -r requirements.txt

      - name: Download model from latest release
        run: |
          python scripts/fetch_data.py --model-only || true
          # The BFSP model is committed in data/models: a booster (plain or xz-compressed),
          # or a manifest naming several (predict_bfsp_today.load_bfsp_model)
          test -f data/models/bfsp_model.lgb || test -f data/models/bfsp_model.lgb.xz \
            || echo "WARNING: No model found"

      - name: Add swap
        # The served models build their features on the history from 2018 (their training
        # summary's history_start): 1.05m rows, which runs the runner's 16 GB out of memory
        # in the feature engine without swap (predict-now run 27) and priced the card in
        # 23-26 minutes with it (predict-now runs 28 and 31, peak 15.5 GB).
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Refresh the sectionals table
        # The sectionals block (model/blocks/sectionals.py) reads data/external/sectionals.csv.gz: the Blandford
        # site's per-run sectionals, which it serves publicly and refreshes twice a day. Rebuilt here from the site's
        # files (the last week refetched) so the card is priced on runs to yesterday; a failure keeps the committed
        # table, which is the training-time one.
        continue-on-error: true
        run: |
          python scripts/build_sectionals.py --fetch --site .sectionals_site \
            --history-table data/external/sectionals.csv.gz --out .sectionals_site/sectionals.csv.gz \
            && cp .sectionals_site/sectionals.csv.gz data/external/sectionals.csv.gz

      - name: Run predictions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          HRB_USERNAME: ${{ secrets.HRB_USERNAME }}
          HRB_PASSWORD: ${{ secrets.HRB_PASSWORD }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          PREDICTIONS_PREFIX: predictions_evening
          RACECARDS_PREFIX: racecards_evening
          DAY_IN: ${{ inputs.date }}
        run: |
          # the racing day just begun: today in the UK at 00:10 UK (the one-day card has turned over at midnight)
          if [ -n "$DAY_IN" ]; then
            if ! [[ "$DAY_IN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "date must be YYYY-MM-DD"; exit 1; fi
            export PREDICT_DATE="$DAY_IN"
          else
            export PREDICT_DATE=$(TZ=Europe/London date +%F)
          fi
          echo "Predicting $PREDICT_DATE at $(TZ=Europe/London date +%H:%M) UK, to predictions_evening/"
          python -m pipeline.predict
