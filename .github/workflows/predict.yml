name: Daily Predictions
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily (the owner, 13 Nov 2026: "move predictions to 03:00 UTC"; 04:00 from 12 Oct, 06:00 until
                          # then): GitHub's 2-core runners price the card in 65 minutes or more; in S3 before the 05:15 UTC trading
  workflow_dispatch:         # Manual trigger

jobs:
  predict:
    runs-on: ubuntu-latest
    outputs:
      serving_flags: ${{ steps.checks.outputs.flags }}
    # The job makes live Betfair calls and the client sets no socket timeout,
    # so bound the whole thing rather than let a hung connection sit until
    # GitHub's six-hour default. The predictions CSV is written before the
    # price snapshot, so a kill here costs the prices and not the card.
    # 60, not 45: the served models build their features on the history from 2018
    # (1.05m rows), which with swap priced a card in 23-26 minutes on a dry run.
    timeout-minutes: 150   # 13 Nov 2026: the ubuntu-26.04 runners priced the card about three times slower; 60 was not enough
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[pipeline]" && pip install -r requirements.txt

      - name: Download model from latest release
        run: |
          python scripts/fetch_data.py --model-only || true
          # The BFSP model is committed in data/models: a booster (plain or xz-compressed),
          # or a manifest naming several (predict_bfsp_today.load_bfsp_model)
          test -f data/models/bfsp_model.lgb || test -f data/models/bfsp_model.lgb.xz \
            || echo "WARNING: No model found"

      - name: Free disk space
        # GitHub's ubuntu-26.04 runners keep /mnt on the root disk: the 16 GB swap file left no room for the
        # database and the job died with "No space left on device" (predict.yml runs 43363524905 and 43373561336,
        # 13 Nov 2026). Tool caches this job never uses go first.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt 2>/dev/null || df -h /
          nproc; free -g
      - name: Add swap
        # The served models build their features on the history from 2018 (their training
        # summary's history_start): 1.05m rows, which runs the runner's 16 GB out of memory
        # in the feature engine without swap (predict-now run 27) and priced the card in
        # 23-26 minutes with it (predict-now runs 28 and 31, peak 15.5 GB).
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Refresh the sectionals table
        # The sectionals block (model/blocks/sectionals.py) reads data/external/sectionals.csv.gz: the Blandford
        # site's per-run sectionals, which it serves publicly and refreshes twice a day. Rebuilt here from the site's
        # files (the last week refetched) so the card is priced on runs to yesterday; a failure keeps the committed
        # table, which is the training-time one.
        continue-on-error: true
        run: |
          python scripts/build_sectionals.py --fetch --site .sectionals_site \
            --history-table data/external/sectionals.csv.gz --out .sectionals_site/sectionals.csv.gz \
            && cp .sectionals_site/sectionals.csv.gz data/external/sectionals.csv.gz

      - name: Run predictions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          HRB_USERNAME: ${{ secrets.HRB_USERNAME }}
          HRB_PASSWORD: ${{ secrets.HRB_PASSWORD }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          # the card's jumps stall read as the results table records it (0; the card scrape fills it from the
          # saddlecloth number): the owner's yes of 11 Nov 2026 on card-as-table-check-1111 (jumps -0.0118, se
          # 0.0047, six days of six). The weight after the claim stays off (Flat +0.0013): model/card_enrich.py
          CARD_AS_TABLE: stall
          # with no card from horseracebase.com, the card from the UK server's recorded Betfair catalogue (card_betfair.py;
          # the owner, 18 Nov 2026: 'fix the card fallback'): its price check passed on 18 Nov's card (run 44310518854:
          # median 0.047 in logs from the HRB card's prices, rank correlation 0.996). With HRB's card nothing changes
          CARD_FALLBACK: 'on'
          # the serving checks (audit MS-3, MS-4, BF-3; predict_bfsp_today.serving_checks): features not built or
          # empty on the card, categories outside the vocabulary, NaNs the trees read as 0, the results' gap. Written
          # here and to the job summary; they change no price and never stop the predictions
          SERVING_CHECKS_PATH: out/serving_checks.json
        run: python -m pipeline.predict

      - name: Serving checks
        id: checks
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os
          try:
              flags = json.load(open("out/serving_checks.json")).get("flags") or []
          except Exception as e:
              print(f"no serving checks read: {e}")
              flags = []
          text = " | ".join(flags)[:1500].replace("\n", " ")
          print(text or "none flagged")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"flags={text}\n")
          PY

      - name: Sync dashboard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
        run: python -m pipeline.sync_dashboard

  alert:
    # OPS-6 (24 Nov 2026): a failed, timed-out or cancelled predictions run leaves the live trader waiting for
    # predictions/<day>.csv (it bets nothing without it), and nothing told the owner before the window closed. The
    # owner is told at once on the day's "Live trading: <day>" issue (scripts/session_watchdog.py --tell, once a run).
    # GitHub's runners, the job's own token, no secrets; the predict job itself is unchanged.
    needs: predict
    if: always() && (needs.predict.result == 'failure' || needs.predict.result == 'cancelled' || needs.predict.outputs.serving_flags != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Tell the owner
        if: needs.predict.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.predict.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/session_watchdog.py --key "predict:$RUN_ID" --tell "the Daily Predictions run ended in $RESULT \
          (a timeout shows as cancelled): the live trader bets nothing until predictions/<day>.csv is in S3; check \
          whether it was written and, if not, run Daily Predictions again (Actions, Run workflow)"
      - name: Tell the owner what the serving checks flagged
        # once a day (the key is the day): the predictions are written as before; this says what they were made on
        if: needs.predict.outputs.serving_flags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FLAGS: ${{ needs.predict.outputs.serving_flags }}
        run: |
          DAY=$(TZ=Europe/London date +%F)
          python3 scripts/session_watchdog.py --key "serving:$DAY" --tell "the serving checks flagged today's \
          predictions (written and served as usual; predict_bfsp_today.serving_checks): $FLAGS"
