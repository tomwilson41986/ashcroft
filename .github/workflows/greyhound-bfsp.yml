name: Greyhound closing price, log(BSP) from the book (read-only)

# The most accurate forecast of each dog's Betfair SP from the book before the off (research/greyhound/bfsp_close.py;
# the owner, 3 Nov 2026: "we need to focus on improving our BFSP model. The final price / log of final price is key").
# Every model walk-forward by day, scored by RMSE of log(BSP) at each mark. Read-only: S3 in, the report out.

on:
  schedule:
    - cron: '47 22 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'first day, YYYY-MM-DD (default 2026-10-06, the first recorded books)'
        required: false
        type: string
      source:
        description: "the books: retimed (the recorder's, re-timed), recorder (as polled) or live (the live key, from 3 Nov 2026)"
        required: false
        type: choice
        options: ['retimed', 'recorder', 'live']
        default: 'retimed'
  push:
    branches: ['claude/determined-fermi-*']
    paths:
      - 'research/greyhound/bfsp_close.py'
      - '.github/workflows/greyhound-bfsp.yml'

permissions:
  contents: read

concurrency:
  group: greyhound-bfsp
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add swap
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: The closing price
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          FROM: ${{ inputs.date_from }}
          SOURCE: ${{ inputs.source || 'retimed' }}
        run: |
          mkdir -p out
          ARGS=(--out out/greyhound_bfsp_close --source "$SOURCE")
          if [ -n "$FROM" ]; then
            [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "dates must be YYYY-MM-DD"; exit 1; }
            ARGS+=(--from "$FROM")
          fi
          python -m research.greyhound.bfsp_close "${ARGS[@]}"
      - name: Summary
        if: always()
        run: |
          [ -f out/greyhound_bfsp_close.md ] && cat out/greyhound_bfsp_close.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greyhound-bfsp-close-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
