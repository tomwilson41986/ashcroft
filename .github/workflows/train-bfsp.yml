name: Train BFSP Model

on:
  workflow_dispatch:
    inputs:
      min_train_days:
        description: 'Minimum training window (days)'
        required: false
        type: number
        default: 365
      val_window:
        description: 'Validation window (days)'
        required: false
        type: number
        default: 30
      step_days:
        description: 'Step between folds (days)'
        required: false
        type: number
        default: 30

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  S3_BUCKET: horseracingresults
  S3_DB_KEY: horse_racing.db

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download historic database from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS credentials not configured. Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as repository secrets."
            exit 1
          fi
          python scripts/fetch_data.py \
            --db-only \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_DB_KEY"

          echo "Database size: $(du -h horse_racing.db | cut -f1)"
          python3 scripts/db_info.py

      - name: Train BFSP model
        run: |
          python train_bfsp.py \
            --min-train-days ${{ inputs.min_train_days || 365 }} \
            --val-window ${{ inputs.val_window || 30 }} \
            --step-days ${{ inputs.step_days || 30 }}

      - name: Commit model to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/bfsp_model.lgb data/models/bfsp_model_meta.json \
                  data/models/bfsp_training_summary.json data/models/bfsp_feature_importance.csv
          git diff --cached --quiet || git commit -m "Update trained BFSP model artifacts"
          git push

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bfsp-model-${{ github.run_number }}
          path: |
            data/models/bfsp_model.lgb
            data/models/bfsp_model_meta.json
            data/models/bfsp_training_summary.json
            data/models/bfsp_feature_importance.csv
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bfsp-model-v$(date +%Y%m%d)-${{ github.run_number }}"
          python scripts/release_notes.py > /tmp/release_notes.md
          gh release create "$TAG" \
            --title "BFSP Model $(date +%Y-%m-%d)" \
            --notes-file /tmp/release_notes.md \
            data/models/bfsp_model.lgb \
            data/models/bfsp_model_meta.json \
            data/models/bfsp_training_summary.json \
            data/models/bfsp_feature_importance.csv
