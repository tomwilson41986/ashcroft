name: Australian early lay (pre-registered test)

# The pre-registered test of the Australian early lay closed at the BSP (reports/preregistration_au_early_lay.md,
# committed in 0fdac24 before this ran; the owner, 4 Nov 2026). Reads the stored WIN tables and the Betfair-only
# model's out-of-sample prices from s3://$CAPTURE_BUCKET/sources/, scores the rule once against its gate, writes
# sources/au/lay_test_report.json. No money, no Betfair key, nothing in the live UK/IE jobs.

on:
  workflow_dispatch:
  push:
    branches: ['claude/bold-cori-*']
    paths:
      - 'au/lay_test.py'
      - '.github/workflows/au-lay-test.yml'

permissions:
  contents: read

concurrency:
  group: au-lay-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests/test_au_lay_test.py
      - name: Score the pre-registered rule
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: |
          set -o pipefail
          python -m au.lay_test | tee au_lay_test.json
      - name: Summary
        if: always()
        run: |
          [ -f au_lay_test.json ] && { echo '## au_lay_test.json'; echo '```'; cat au_lay_test.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
