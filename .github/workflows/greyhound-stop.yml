name: Greyhound traders, stop or resume

# The owner's switch for the live greyhound early lay (greyhound/early_lay.py; the owner, 3 Nov 2026: "i will monitor
# and stop manually if any concerns"). 'stop' writes the S3 object greyhound/STOP: within a poll the trader lays
# nothing new and cancels its resting lays, and still greens up the lays already matched. 'resume' removes it. The
# horse trader's own switch, trading/STOP, stops the greyhound trader too, but this one never touches the horses.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'stop (no new greyhound lays) or resume'
        required: true
        type: choice
        options: ['stop', 'resume']
        default: 'stop'
      trader:
        description: 'which: the early lay (greyhound/STOP) or the take and close (greyhound/take_close/STOP)'
        required: false
        type: choice
        options: ['early_lay', 'take_close']
        default: 'early_lay'

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the switch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          ACTION: ${{ inputs.action }}
          TRADER: ${{ inputs.trader || 'early_lay' }}
        run: |
          # the take and close has its own switch (the owner, 18 Nov 2026): greyhound/STOP does not stop it
          if [ "$TRADER" = "take_close" ]; then KEY="greyhound/take_close/STOP"; else KEY="greyhound/STOP"; fi
          if [ "$ACTION" = "stop" ]; then
            echo "stopped from GitHub Actions run $GITHUB_RUN_ID" | aws s3 cp - "s3://$BUCKET/$KEY"
            echo "$KEY written: $TRADER places nothing new; what is already matched is still closed"
          else
            aws s3 rm "s3://$BUCKET/$KEY"
            echo "$KEY removed: $TRADER trades again"
          fi
          for k in greyhound/STOP greyhound/take_close/STOP trading/STOP; do
            aws s3 ls "s3://$BUCKET/$k" > /dev/null 2>&1 && echo "ON:  $k" || echo "off: $k"
          done
