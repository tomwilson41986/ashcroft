name: Paper models (greyhounds, football), the football book record and the racing census

# The paper trials, apart from the live trader (the owner, 2 Nov 2026: keep UK/IE safe; every other model runs on its
# own and has to prove itself). Until 2 Nov these two traders ran as background processes inside live-trade.yml's
# trading step; they now run here, on their own runner, and can place no order:
#   - no --live is ever passed to the greyhound paper trader, and GREYHOUND_LIVE is pinned to 'no' (it stays on paper
#     unless both its switch and --live are given: greyhound/live.py). The football trader runs in football-trade.yml
#     from 3 Nov 2026 (its own runner; real stakes only with FOOTBALL_LIVE=yes);
#   - the delayed application key, except the greyhound processes: the owner, 2 Nov 2026, "use the live key, just
#     don't execute bets yet": the greyhound paper trader (GREYHOUND_LIVE pinned 'no', never --live) and the greyhound
#     book recorder (greyhound/book_record.py, read-only by construction) read on the live key; every recorder of
#     another sport keeps the delayed key;
#   - its own Python environment and certificate folder, so nothing here touches the live job's.
# The one exception, the owner, 3 Nov 2026: "lets go live now, i will monitor and stop manually if any concerns";
# "use early lay". The greyhound early lay (greyhound/early_lay.py, the forward test's primary rule) places real
# orders on the live key, with GREYHOUND_EARLY_LAY=live (the dispatch input, else the repository variable, else
# live). Stop it: the S3 object greyhound/STOP (greyhound-stop.yml) stops new lays and greens up the matched ones;
# the variable GREYHOUND_EARLY_LAY=paper keeps it off the next days. Every other trader here stays on paper.
# The runner: a second self-hosted runner on the UK server (Betfair refuses logins from GitHub's own runners: 403,
# 1 Nov), labelled with vars.PAPER_MODELS_RUNNER (default 'paper-models'). It must not be the live trader's runner: the
# job stops if the two are the same, because a job there would hold the live trader's runner and could delay its
# 05:15 UTC start. Until such a runner is registered, the scheduled runs wait in GitHub's queue and the trials pause.
# Ledger as before: s3://$CAPTURE_BUCKET/sources/greyhound/live/paper/<day>/.

on:
  schedule:
    - cron: '45 5 * * *'      # both traders, to 21:30 UK
  workflow_dispatch:
    inputs:
      early_lay:
        description: "the greyhound early lay: live (real orders on the owner's account) or paper (logged, nothing sent)"
        required: false
        type: choice
        options: ['live', 'paper']
        default: 'live'

permissions:
  contents: read

concurrency:
  group: paper-models
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
    timeout-minutes: 1000
    steps:
      - name: Not on the live trader's runner
        id: runner_guard
        env:
          PAPER_RUNNER_LABEL: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$PAPER_RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "PAPER_MODELS_RUNNER is the live trader's runner ($LIVE_RUNNER_LABEL): the paper models do not run there"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (its own environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-paper"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-paper"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt
      - name: Write the Betfair certificate (its own folder)
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            D="$HOME/.betfair/certs-paper"
            mkdir -p "$D"
            printf '%s\n' "$BETFAIR_CERT" > "$D/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$D/betfair.key"
            chmod 600 "$D/betfair.key"
            echo "BETFAIR_CERT_FILE=$D/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$D/betfair.key" >> "$GITHUB_ENV"
          fi
      - name: Racing by country (census, read-only)
        # every country's Betfair racing, the week ahead (sources/betfair_census.py): whether Hong Kong and Japan trade
        # before their form data is built; read at 05:45 UTC while Japan, Hong Kong and Australia race
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: timeout 300 python -m sources.betfair_census --hours 168
      - name: Trade (the greyhound early lay live, the rest on paper)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          # the delayed key for everything but the greyhound processes (below)
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          # the greyhound paper trader and book recorder only (the owner, 2 Nov 2026): read-only, no bets
          BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
          GREYHOUND_LIVE: 'no'
          # API-Football (read-only data, not a betting key): the football line-ups and injuries collector
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GREYHOUND_EARLY_LAY: ${{ inputs.early_lay || vars.GREYHOUND_EARLY_LAY || 'live' }}
        run: |
          set +e
          # the greyhound model (greyhound/live.py, greyhound/live_config.json): each GB greyhound runner backed once on
          # paper, at its first real price, where the edge clears 0.2. S3 greyhound/STOP or trading/STOP stops it.
          # the greyhound processes read on the live key when there is one (its value is never printed)
          GHKEY="${BETFAIR_LIVE_APP_KEY:-$BETFAIR_APP_KEY}"
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.live --trade --until 21:30 > "$RUNNER_TEMP/greyhound_trader.log" 2>&1 &
          GHT=$!
          # the greyhound books every 5 s near the off, with traded volume (reports/greyhound_roadmap.md 0.2)
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.book_record --until 21:30 > "$RUNNER_TEMP/greyhound_books.log" 2>&1 &
          GBR=$!
          # the greyhound early lay (greyhound/early_lay.py): real orders only when GREYHOUND_EARLY_LAY is 'live'
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.early_lay --trade --live --until 21:30 > "$RUNNER_TEMP/greyhound_early_lay.log" 2>&1 &
          GEL=$!
          # the football trader moved to football-trade.yml on 3 Nov 2026 (the owner: every match on Betfair, on the
          # live feed, with small real stakes that keep the live key in betting use); this job keeps its records
          # the Betfair football books with their sizes (read-only; the unmodified betfair_recorder.py, tag
          # football_<country>): today's MATCH_ODDS and OVER_UNDER_25 in the leagues football-data covers, every 15
          # minutes and every 2 in the hour before kick-off, and tomorrow's the evening before (the early price a trade
          # would open at). One process a country, so no catalogue call reaches its 100 markets on a busy Saturday and
          # the recorder's code is not changed (the owner, 2 Nov 2026: nothing in the live horse system changes for
          # another sport). The prices a football paper trial is scored at (reports/open_close/model_football_exchange.md).
          TOMORROW=$(TZ=Europe/London date -d tomorrow +%F)
          FBREC=()
          for C in GB ES IT DE FR NL BE PT TR GR; do
            python betfair_recorder.py --record --until 21:30 --event-type 1 --market-types MATCH_ODDS,OVER_UNDER_25 \
              --countries "$C" --tag "football_$C" --every 900 --every-near 120 \
              > "$RUNNER_TEMP/football_$C.log" 2>&1 &
            FBREC+=($!)
            python betfair_recorder.py --record --date "$TOMORROW" --evening 17:00-21:30 --event-type 1 \
              --market-types MATCH_ODDS,OVER_UNDER_25 --countries "$C" --tag "football_eve_$C" --every 1800 \
              > "$RUNNER_TEMP/football_eve_$C.log" 2>&1 &
            FBREC+=($!)
          done
          # the football line-ups and injuries (sources/api_football_lineups.py, API-Football, read-only): each match of
          # the 22 divisions polled from 75 minutes before kick-off until both elevens are out (the time they first
          # appear kept), and once more at T-10; the day's injuries every 3 hours. The team-news test's data, to set
          # against the football book record above (reports/football_model.md s.5). It places nothing.
          python -m sources.api_football_lineups --collect --until 21:30 > "$RUNNER_TEMP/football_lineups.log" 2>&1 &
          FBL=$!
          # the books at football-data's collection moment for the matches the two records above cannot reach then
          # (reports/football_review_and_roadmap.md 2.5): on Fridays from 16:55 UK the markets of Sunday and Monday,
          # on Tuesdays from 12:55 UK those of Wednesday and Thursday, for 50 minutes, tag football_coll_<C>. The
          # unmodified betfair_recorder.py (--date with --for-minutes).
          coll_record() {
            NOW=$(date +%s); START=$(TZ=Europe/London date -d "today $1" +%s)
            [ "$START" -gt "$NOW" ] && sleep $((START - NOW))
            for O in $2; do
              D=$(TZ=Europe/London date -d "+$O day" +%F)
              for C in GB ES IT DE FR NL BE PT TR GR; do
                python betfair_recorder.py --record --date "$D" --for-minutes 50 --event-type 1 \
                  --market-types MATCH_ODDS,OVER_UNDER_25 --countries "$C" --tag "football_coll_$C" --every 600 \
                  > "$RUNNER_TEMP/football_coll_${O}_$C.log" 2>&1 &
              done
            done
            wait
          }
          DOW=$(TZ=Europe/London date +%u)
          if [ "$DOW" = 5 ]; then coll_record 16:55 "2 3" & FBREC+=($!); fi
          if [ "$DOW" = 2 ]; then coll_record 12:55 "1 2" & FBREC+=($!); fi
          wait "$GHT"; GC=$?; echo "greyhound paper trader exited $GC"
          tail -n 20 "$RUNNER_TEMP/greyhound_trader.log"
          wait "$GBR"; echo "greyhound book record exited $?"
          tail -n 5 "$RUNNER_TEMP/greyhound_books.log"
          wait "$GEL"; echo "greyhound early lay ($GREYHOUND_EARLY_LAY) exited $?"
          tail -n 40 "$RUNNER_TEMP/greyhound_early_lay.log"
          for P in "${FBREC[@]}"; do wait "$P"; done
          echo "football records exited"; tail -n 2 "$RUNNER_TEMP"/football_*.log
          wait "$FBL"; LC=$?; echo "football line-ups exited $LC"; tail -n 3 "$RUNNER_TEMP/football_lineups.log"
          [ "$LC" = 0 ] || echo "::warning::the football line-ups collector exited $LC (its log above)"
          [ "$GC" = 0 ]
      - name: Football line-up tables
        # rebuilt whole from the raw polls (safe to rerun); a failure here costs no data
        if: ${{ !cancelled() && steps.runner_guard.outcome == 'success' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
        run: timeout 900 python -m sources.api_football_lineups --build
