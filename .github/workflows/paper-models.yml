name: Paper models (greyhounds) and the racing census

# The paper trials, apart from the live trader (the owner, 2 Nov 2026: keep UK/IE safe; every other model runs on its
# own and has to prove itself). Until 2 Nov these two traders ran as background processes inside live-trade.yml's
# trading step; they now run here, on their own runner, and can place no order:
#   - no --live is ever passed to the greyhound paper trader, and GREYHOUND_LIVE is pinned to 'no' (it stays on paper
#     unless both its switch and --live are given: greyhound/live.py);
#   - no football: every football process (the trader, the book records, the line-ups collector) runs in
#     football-trade.yml on the football runner (the owner, 3 Nov 2026: football kept apart from greyhounds and racing);
#   - the delayed application key, except the greyhound processes: the owner, 2 Nov 2026, "use the live key, just
#     don't execute bets yet": the greyhound paper trader (GREYHOUND_LIVE pinned 'no', never --live) and the greyhound
#     book recorder (greyhound/book_record.py, read-only by construction) read on the live key; the racing census
#     and the greyhound market record (betfair_recorder.py, from the horse racing runner on 3 Nov 2026) keep the
#     delayed key;
#   - its own Python environment and certificate folder, so nothing here touches the live job's.
# The one exception, the owner, 3 Nov 2026: "lets go live now, i will monitor and stop manually if any concerns";
# "use early lay". The greyhound early lay (greyhound/early_lay.py, the forward test's primary rule) places real
# orders on the live key only with GREYHOUND_EARLY_LAY=live (the dispatch input, else the repository variable, else
# paper: the owner, 5 Nov 2026, the audit) and a daily loss limit (vars.GREYHOUND_EARLY_LAY_DAILY_LOSS, GBP). Stop it:
# the S3 object greyhound/STOP (greyhound-stop.yml) stops new lays, cancels the resting ones and greens up the matched. The second, the owner, 4 Nov 2026: "go live with
# live trading today": the greyhound quotes around the mid (greyhound/quote_mid.py, research/greyhound/profit_sim.py
# mid_*), real orders only with GREYHOUND_QUOTE_MID=live (the dispatch input, else the repository variable, else
# paper: on 4 Nov the simulator, its look-ahead fixed, found every margin and stake losing on 3 Nov's live books, so it
# stays on paper until a variant shows an edge); the same S3 STOP stops it. Every other trader here stays on paper.
# The runner: a second self-hosted runner on the UK server (Betfair refuses logins from GitHub's own runners: 403,
# 1 Nov), labelled with vars.PAPER_MODELS_RUNNER (default 'paper-models'). It must not be the live trader's runner: the
# job stops if the two are the same, because a job there would hold the live trader's runner and could delay its
# 05:15 UTC start. Until such a runner is registered, the scheduled runs wait in GitHub's queue and the trials pause.
# Ledger as before: s3://$CAPTURE_BUCKET/sources/greyhound/live/paper/<day>/.

on:
  schedule:
    - cron: '45 5 * * *'      # the greyhound processes, to 21:30 UK
  workflow_dispatch:
    inputs:
      early_lay:
        description: "the greyhound early lay: live (real orders on the owner's account) or paper (logged, nothing sent)"
        required: false
        type: choice
        options: ['paper', 'live']
        default: 'paper'
      quote_mid:
        description: "the greyhound quotes around the mid: paper (logged, nothing sent) or live (real orders)"
        required: false
        type: choice
        options: ['paper', 'live']
        default: 'paper'

permissions:
  contents: read

concurrency:
  group: paper-models
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
    timeout-minutes: 1000
    steps:
      - name: Not on the live trader's runner
        id: runner_guard
        env:
          PAPER_RUNNER_LABEL: ${{ vars.PAPER_MODELS_RUNNER || 'paper-models' }}
          LIVE_RUNNER_LABEL: ${{ vars.BETFAIR_RUNNER }}
        run: |
          if [ -n "$LIVE_RUNNER_LABEL" ] && [ "$PAPER_RUNNER_LABEL" = "$LIVE_RUNNER_LABEL" ]; then
            echo "PAPER_MODELS_RUNNER is the live trader's runner ($LIVE_RUNNER_LABEL): the paper models do not run there"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Python (its own environment)
        run: |
          VENV="$HOME/.venvs/ashcroft-paper"
          if ! "$VENV/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' 2>/dev/null; then
            UV="$HOME/.venvs/uv-paper"
            [ -x "$UV/bin/uv" ] || { python3 -m venv "$UV" && "$UV/bin/pip" install -q uv==0.8.17; }
            rm -rf "$VENV"
            "$UV/bin/uv" venv --seed --python 3.12 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -q -e ".[pipeline]" && pip install -q -r requirements.txt
      - name: Write the Betfair certificate (its own folder)
        env:
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_KEY: ${{ secrets.BETFAIR_KEY }}
        run: |
          if [ -n "$BETFAIR_CERT" ] && [ -n "$BETFAIR_KEY" ]; then
            D="$HOME/.betfair/certs-paper"
            mkdir -p "$D"
            printf '%s\n' "$BETFAIR_CERT" > "$D/betfair.crt"
            printf '%s\n' "$BETFAIR_KEY" > "$D/betfair.key"
            chmod 600 "$D/betfair.key"
            echo "BETFAIR_CERT_FILE=$D/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_FILE=$D/betfair.key" >> "$GITHUB_ENV"
          fi
      - name: Racing by country (census, read-only)
        # every country's Betfair racing, the week ahead (sources/betfair_census.py): whether Hong Kong and Japan trade
        # before their form data is built; read at 05:45 UTC while Japan, Hong Kong and Australia race
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: timeout 300 python -m sources.betfair_census --hours 168
      - name: Trade (the greyhound early lay live, the quotes and the rest on paper)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          ULTRA_BETTING_S3_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_BUCKET: ${{ vars.ULTRA_BETTING_S3_BUCKET || 'ashcroft' }}
          CAPTURE_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-2' }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          # the delayed key for everything but the greyhound processes (below)
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          # the greyhound paper trader and book recorder only (the owner, 2 Nov 2026): read-only, no bets
          BETFAIR_LIVE_APP_KEY: ${{ secrets.BETFAIR_LIVE_APP_KEY }}
          GREYHOUND_LIVE: 'no'
          # paper unless switched on (the owner, 5 Nov 2026, the audit: "Yes do these"); live also needs a daily
          # loss limit in GBP (vars.GREYHOUND_EARLY_LAY_DAILY_LOSS), else greyhound/early_lay.py sends no order
          GREYHOUND_EARLY_LAY: ${{ inputs.early_lay || vars.GREYHOUND_EARLY_LAY || 'paper' }}
          GREYHOUND_EARLY_LAY_DAILY_LOSS: ${{ vars.GREYHOUND_EARLY_LAY_DAILY_LOSS }}
          GREYHOUND_QUOTE_MID: ${{ inputs.quote_mid || vars.GREYHOUND_QUOTE_MID || 'paper' }}
          # live quotes also need the owner's daily loss limit in GBP (the owner, 5 Nov 2026), else none is sent
          GREYHOUND_QUOTE_MID_DAILY_LOSS: ${{ vars.GREYHOUND_QUOTE_MID_DAILY_LOSS }}
        run: |
          set +e
          # the greyhound model (greyhound/live.py, greyhound/live_config.json): each GB greyhound runner backed once on
          # paper, at its first real price, where the edge clears 0.2. S3 greyhound/STOP or trading/STOP stops it.
          # the greyhound processes read on the live key when there is one (its value is never printed)
          GHKEY="${BETFAIR_LIVE_APP_KEY:-$BETFAIR_APP_KEY}"
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.live --trade --until 21:30 > "$RUNNER_TEMP/greyhound_trader.log" 2>&1 &
          GHT=$!
          # the greyhound books every 5 s near the off, with traded volume (reports/greyhound_roadmap.md 0.2)
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.book_record --until 21:30 > "$RUNNER_TEMP/greyhound_books.log" 2>&1 &
          GBR=$!
          # Betfair's Exchange Stream for the greyhound markets, raw (the owner, 5 Nov 2026, the audit C1): the full ladder,
          # the volume traded at each price and every change, read-only (no order subscription), to s3 betfair_stream/
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.stream_record --until 21:30 > "$RUNNER_TEMP/greyhound_stream.log" 2>&1 &
          GSR=$!
          # the greyhound early lay (greyhound/early_lay.py): real orders only when GREYHOUND_EARLY_LAY is 'live'
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.early_lay --trade --live --until 21:30 > "$RUNNER_TEMP/greyhound_early_lay.log" 2>&1 &
          GEL=$!
          # its paper books beside it (the owner, 4 Nov 2026: "run this on paper. Keep running 10% too"): the rule at 10%
          # and the short-priced lay at 20% and 10%, on the same books, never --live: nothing is sent
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.early_lay --trade --paper-variants m10,short20,short10 --until 21:30 > "$RUNNER_TEMP/greyhound_early_lay_paper.log" 2>&1 &
          GELP=$!
          # the greyhound quotes around the mid (greyhound/quote_mid.py): real orders only when GREYHOUND_QUOTE_MID is 'live'
          BETFAIR_APP_KEY="$GHKEY" python -m greyhound.quote_mid --trade --live --until 21:30 > "$RUNNER_TEMP/greyhound_quote_mid.log" 2>&1 &
          GQM=$!
          # the GB/IE greyhound win and place markets with the market recorder (read-only, the delayed key;
          # betfair_live/<day>/books_greyhound.csv), moved here from the horse racing runner on 3 Nov 2026 (the owner:
          # nothing but horse racing there): yesterday's settled books, then the day's record
          Y="$(TZ=Europe/London date -d yesterday +%F)"
          timeout 300 python betfair_recorder.py --final --event-type 4339 --tag greyhound --date "$Y" || true
          python betfair_recorder.py --record --final --until 21:30 --event-type 4339 --tag greyhound \
            --market-types WIN,PLACE > "$RUNNER_TEMP/greyhound.log" 2>&1 &
          DOGS=$!
          wait "$GHT"; GC=$?; echo "greyhound paper trader exited $GC"
          tail -n 20 "$RUNNER_TEMP/greyhound_trader.log"
          wait "$GBR"; echo "greyhound book record exited $?"
          wait "$GSR"; echo "greyhound stream record exited $?"; tail -n 10 "$RUNNER_TEMP/greyhound_stream.log"
          tail -n 5 "$RUNNER_TEMP/greyhound_books.log"
          wait "$GEL"; ELC=$?; echo "greyhound early lay ($GREYHOUND_EARLY_LAY) exited $ELC"
          tail -n 40 "$RUNNER_TEMP/greyhound_early_lay.log"
          wait "$GELP"; ELP=$?; echo "greyhound early lay paper books exited $ELP"
          tail -n 20 "$RUNNER_TEMP/greyhound_early_lay_paper.log"
          wait "$GQM"; QMC=$?; echo "greyhound quotes around the mid ($GREYHOUND_QUOTE_MID) exited $QMC"
          tail -n 40 "$RUNNER_TEMP/greyhound_quote_mid.log"
          wait "$DOGS"; echo "greyhound market record exited $?"; tail -n 3 "$RUNNER_TEMP/greyhound.log"
          # a trader that crashed fails the job, so GitHub's failure notice reaches the owner (the audit A6); before,
          # only the paper trader's exit counted
          [ "$GC" = 0 ] && [ "$ELC" = 0 ] && [ "$ELP" = 0 ] && [ "$QMC" = 0 ]
