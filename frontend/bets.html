<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashcroft — Bet Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Bet Tracker</h1>
                <p class="page-subtitle">All bets with status, results, and P&amp;L</p>
            </div>
            <div class="flex items-center space-x-2">
                <select id="filter-strategy" class="input"></select>
                <select id="filter-date" class="input"><option value="">All dates</option></select>
                <select id="filter-status" class="input">
                    <option value="">All statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="WON">Won</option>
                    <option value="LOST">Lost</option>
                </select>
                <button onclick="applyFilters()" class="btn">Filter</button>
            </div>
        </div>

        <div class="stat-grid stat-grid-5 mb-6" id="bets-summary"></div>
        <div class="card" id="bets-container">
            <div class="empty-state"><p>Loading...</p></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('sidebar').innerHTML = renderSidebar('bets');

        // Populate strategy dropdown
        const stratSel = document.getElementById('filter-strategy');
        STRATEGIES.forEach(s => {
            const o = document.createElement('option');
            o.value = s.id; o.textContent = s.label;
            stratSel.appendChild(o);
        });

        let allBets = [];

        (async () => {
            const data = await apiFetch('/api/bets/all');
            if (!data || !data.length) {
                document.getElementById('bets-summary').innerHTML = '';
                document.getElementById('bets-container').innerHTML = '<div class="empty-state"><p>No bets found.</p><p>Run <code>python edge_scanner.py</code> to generate bets.</p></div>';
                return;
            }
            allBets = data;
            const dates = [...new Set(data.map(b => b.race_date))].sort().reverse();
            const sel = document.getElementById('filter-date');
            dates.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });
            applyFilters();
        })();

        function applyFilters() {
            const strategy = document.getElementById('filter-strategy').value;
            let filtered = applyStrategy(allBets, strategy);
            const d = document.getElementById('filter-date').value;
            const s = document.getElementById('filter-status').value;
            if (d) filtered = filtered.filter(b => b.race_date === d);
            if (s) filtered = filtered.filter(b => b.status === s);
            renderSummary(filtered);
            renderList(filtered);
        }

        function renderSummary(bets) {
            const won = bets.filter(b => b.status === 'WON').length;
            const lost = bets.filter(b => b.status === 'LOST').length;
            const pending = bets.filter(b => b.status === 'PENDING').length;
            const pnl = bets.reduce((s, b) => s + (b.net_pnl || 0), 0);
            document.getElementById('bets-summary').innerHTML = `
                <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${bets.length}</div></div>
                <div class="stat-card"><div class="stat-label">Won</div><div class="stat-value text-green">${won}</div></div>
                <div class="stat-card"><div class="stat-label">Lost</div><div class="stat-value text-red">${lost}</div></div>
                <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value text-yellow">${pending}</div></div>
                <div class="stat-card"><div class="stat-label">Net P&amp;L</div><div class="stat-value ${colorClass(pnl)}">${fmtPnl(pnl)}</div></div>`;
        }

        function renderList(bets) {
            if (!bets.length) { document.getElementById('bets-container').innerHTML = '<div class="empty-state"><p>No bets match filters.</p></div>'; return; }

            let html = `<table><thead><tr>
                <th>Date</th><th>Time</th><th>Track</th><th>Horse</th><th class="text-right">Rank</th><th>Type</th>
                <th class="text-right">Pred</th><th class="text-right">Back</th><th class="text-right">Edge</th>
                <th class="text-right">Stake</th><th>Status</th><th class="text-right">Pos</th><th class="text-right">P&amp;L</th>
            </tr></thead><tbody>`;

            for (const b of bets) {
                html += `<tr>
                    <td class="text-muted">${b.race_date}</td><td>${b.race_time||'-'}</td><td>${b.track}</td>
                    <td class="font-medium">${b.horse_name}</td>
                    <td class="text-right">${b.rank || '-'}</td>
                    <td>${typeBadge(b.bet_type)}</td>
                    <td class="text-right">${b.predicted_bfsp ? b.predicted_bfsp.toFixed(2) : '-'}</td>
                    <td class="text-right">${b.betfair_back ? b.betfair_back.toFixed(2) : '-'}</td>
                    <td class="text-right ${b.edge_pct>=15?'text-green font-bold':''}">${b.edge_pct ? '+'+b.edge_pct.toFixed(1)+'%' : '-'}</td>
                    <td class="text-right">£${b.stake ? b.stake.toFixed(2) : '-'}</td>
                    <td>${statusBadge(b.status)}</td>
                    <td class="text-right text-muted">${b.placing ? ordinal(b.placing) : '-'}</td>
                    <td class="text-right font-medium ${colorClass(b.net_pnl)}">${b.net_pnl != null ? fmtPnl(b.net_pnl) : '-'}</td>
                </tr>`;
            }
            document.getElementById('bets-container').innerHTML = html + '</tbody></table>';
        }
    </script>
</body>
</html>
