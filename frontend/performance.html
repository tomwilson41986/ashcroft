<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashcroft — Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Performance</h1>
                <p class="page-subtitle">P&amp;L tracking, strike rates, and edge analysis</p>
            </div>
            <div class="flex items-center space-x-2">
                <label class="text-muted" style="font-size:0.8125rem; white-space:nowrap">Strategy:</label>
                <select id="strategy-select" class="input" onchange="onStrategyChange()"></select>
            </div>
        </div>

        <!-- Summary -->
        <div class="stat-grid stat-grid-6 mb-6" id="summary-stats">
            <div class="stat-card"><div class="stat-label">Total Bets</div><div class="stat-value">-</div></div>
        </div>

        <!-- Charts -->
        <div class="grid-2 mb-6">
            <div class="card">
                <div class="card-header">Cumulative P&amp;L</div>
                <div class="card-body">
                    <canvas id="cumPnlChart" height="200"></canvas>
                    <div id="cum-empty" class="empty-state hidden"><p>No data yet</p></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">Daily P&amp;L</div>
                <div class="card-body">
                    <canvas id="dailyPnlChart" height="200"></canvas>
                    <div id="daily-empty" class="empty-state hidden"><p>No data yet</p></div>
                </div>
            </div>
        </div>

        <!-- Edge Stats -->
        <div class="card mb-6 hidden" id="edge-card">
            <div class="card-header">Strike Rate by Edge Bucket</div>
            <div id="edge-container"></div>
        </div>

        <!-- Daily Breakdown -->
        <div class="card hidden" id="daily-card">
            <div class="card-header">Daily Breakdown</div>
            <div id="daily-container"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('sidebar').innerHTML = renderSidebar('performance');

        // Populate strategy dropdown
        const stratSel = document.getElementById('strategy-select');
        STRATEGIES.forEach(s => {
            const o = document.createElement('option');
            o.value = s.id; o.textContent = s.label;
            stratSel.appendChild(o);
        });

        let allBetsData = [];
        let cumChart = null, dailyChart = null;

        (async () => {
            allBetsData = await apiFetch('/api/bets/all') || [];
            onStrategyChange();
        })();

        function onStrategyChange() {
            const strategy = document.getElementById('strategy-select').value;
            const filtered = applyStrategy(allBetsData, strategy);
            const summary = computeSummaryFromBets(filtered);
            const daily = computeDailyPnlFromBets(filtered);
            const edge = computeEdgeStatsFromBets(filtered);
            renderStats(summary);
            renderCharts(daily);
            renderEdge(edge);
            renderDaily(daily);
        }

        function renderStats(d) {
            if (!d || !d.total_bets) {
                document.getElementById('summary-stats').innerHTML = '<div class="stat-card" style="grid-column:span 6"><div class="empty-state"><p>No settled bets for this strategy</p></div></div>';
                return;
            }
            const losses = (d.total_bets||0) - (d.wins||0);
            document.getElementById('summary-stats').innerHTML = `
                <div class="stat-card"><div class="stat-label">Total Bets</div><div class="stat-value">${d.total_bets}</div></div>
                <div class="stat-card"><div class="stat-label">Strike Rate</div><div class="stat-value">${(d.strike_rate||0).toFixed(1)}%</div><div class="stat-detail">${d.wins||0}W / ${losses}L</div></div>
                <div class="stat-card"><div class="stat-label">Net P&amp;L</div><div class="stat-value ${colorClass(d.net_pnl)}">${fmtPnl(d.net_pnl||0)}</div></div>
                <div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value ${colorClass(d.roi)}">${(d.roi||0).toFixed(1)}%</div></div>
                <div class="stat-card"><div class="stat-label">Avg Edge</div><div class="stat-value">${(d.avg_edge||0).toFixed(1)}%</div></div>
                <div class="stat-card"><div class="stat-label">Bank</div><div class="stat-value ${colorClass((d.bank||1000)-1000)}">£${(d.bank||1000).toFixed(2)}</div></div>`;
        }

        function renderCharts(data) {
            // Destroy previous chart instances
            if (cumChart) { cumChart.destroy(); cumChart = null; }
            if (dailyChart) { dailyChart.destroy(); dailyChart = null; }

            if (!data || !data.length) {
                document.getElementById('cum-empty').classList.remove('hidden');
                document.getElementById('daily-empty').classList.remove('hidden');
                document.getElementById('cumPnlChart').style.display = 'none';
                document.getElementById('dailyPnlChart').style.display = 'none';
                return;
            }
            document.getElementById('cum-empty').classList.add('hidden');
            document.getElementById('daily-empty').classList.add('hidden');
            document.getElementById('cumPnlChart').style.display = '';
            document.getElementById('dailyPnlChart').style.display = '';

            const dates = data.map(d => d.date), cum = data.map(d => d.cumulative_pnl), net = data.map(d => d.net_pnl);

            cumChart = new Chart(document.getElementById('cumPnlChart'), {
                type: 'line',
                data: { labels: dates, datasets: [{ label: 'Cumulative P&L', data: cum, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.08)', fill: true, tension: 0.3, pointRadius: 3 }] },
                options: chartOptions('£'),
            });
            dailyChart = new Chart(document.getElementById('dailyPnlChart'), {
                type: 'bar',
                data: { labels: dates, datasets: [{ label: 'Daily P&L', data: net, backgroundColor: net.map(v => v >= 0 ? 'rgba(22,163,74,0.6)' : 'rgba(220,38,38,0.6)'), borderColor: net.map(v => v >= 0 ? '#16a34a' : '#dc2626'), borderWidth: 1 }] },
                options: chartOptions('£'),
            });
        }

        function renderEdge(data) {
            if (!data || !data.length) {
                document.getElementById('edge-card').classList.add('hidden');
                return;
            }
            document.getElementById('edge-card').classList.remove('hidden');
            let html = '<table><thead><tr><th>Edge Bucket</th><th class="text-right">Bets</th><th class="text-right">Won</th><th class="text-right">Strike Rate</th><th class="text-right">P&amp;L</th></tr></thead><tbody>';
            for (const r of data) {
                const sr = r.total > 0 ? (r.won / r.total * 100).toFixed(1) : '0.0';
                html += `<tr><td class="font-medium">${r.bucket}</td><td class="text-right">${r.total}</td><td class="text-right">${r.won}</td><td class="text-right">${sr}%</td><td class="text-right ${colorClass(r.pnl)}">${fmtPnl(r.pnl||0)}</td></tr>`;
            }
            document.getElementById('edge-container').innerHTML = html + '</tbody></table>';
        }

        function renderDaily(data) {
            if (!data || !data.length) {
                document.getElementById('daily-card').classList.add('hidden');
                return;
            }
            document.getElementById('daily-card').classList.remove('hidden');
            let html = '<table><thead><tr><th>Date</th><th class="text-right">Bets</th><th class="text-right">W/L</th><th class="text-right">Staked</th><th class="text-right">Net P&amp;L</th><th class="text-right">ROI</th><th class="text-right">Cumulative</th><th class="text-right">Bank</th></tr></thead><tbody>';
            for (const d of [...data].reverse()) {
                html += `<tr><td>${d.date}</td><td class="text-right">${d.num_bets}</td><td class="text-right">${d.winners}W/${d.losers}L</td>
                    <td class="text-right">£${(d.total_staked||0).toFixed(2)}</td>
                    <td class="text-right font-medium ${colorClass(d.net_pnl)}">${fmtPnl(d.net_pnl)}</td>
                    <td class="text-right ${colorClass(d.roi_pct)}">${d.roi_pct.toFixed(1)}%</td>
                    <td class="text-right ${colorClass(d.cumulative_pnl)}">${fmtPnl(d.cumulative_pnl)}</td>
                    <td class="text-right">£${d.bank_end.toFixed(2)}</td></tr>`;
            }
            document.getElementById('daily-container').innerHTML = html + '</tbody></table>';
        }
    </script>
</body>
</html>
